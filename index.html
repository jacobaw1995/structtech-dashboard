<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StructTech OPS Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d0f0e;
  --surface: #141614;
  --surface2: #1a1d1a;
  --border: #2a2e2a;
  --border2: #363b36;
  --text: #e8ebe6;
  --muted: #7a8278;
  --accent: #c8f060;
  --accent2: #4ade80;
  --warn: #f59e0b;
  --danger: #f87171;
  --blue: #60a5fa;
  --teal: #2dd4bf;
  --purple: #a78bfa;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 14px; }
body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; }

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

/* ── Utilities ── */
.hidden { display: none !important; }
.flex { display: flex; }
.flex-1 { flex: 1; }
.gap-8 { gap: 8px; }
.gap-12 { gap: 12px; }
.mt-8 { margin-top: 8px; }
.mt-12 { margin-top: 12px; }
.mt-16 { margin-top: 16px; }

/* ── Header ── */
header {
  position: sticky; top: 0; z-index: 100;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  height: 56px;
  display: flex; align-items: center;
  padding: 0 24px; gap: 16px;
}
.header-logo { display: flex; align-items: baseline; gap: 6px; margin-right: auto; }
.logo-main { font-family: 'Bebas Neue', cursive; font-size: 22px; color: var(--accent); letter-spacing: 0.05em; }
.logo-div { color: var(--border2); font-size: 18px; }
.logo-ops { font-family: 'DM Mono', monospace; font-size: 13px; color: var(--muted); letter-spacing: 0.1em; }
.sync-status { font-family: 'DM Mono', monospace; font-size: 11px; padding: 4px 10px; border-radius: 4px; border: 1px solid var(--border); }
.sync-loading { color: var(--warn); border-color: rgba(245,158,11,0.3); background: rgba(245,158,11,0.07); }
.sync-saving { color: var(--blue); border-color: rgba(96,165,250,0.3); background: rgba(96,165,250,0.07); }
.sync-saved { color: var(--muted); border-color: var(--border); background: transparent; }
.sync-failed { color: var(--danger); border-color: rgba(248,113,113,0.3); background: rgba(248,113,113,0.07); }
.header-date { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted); }
.week-badge { font-family: 'Bebas Neue', cursive; font-size: 16px; background: var(--surface2); border: 1px solid var(--border2); padding: 4px 10px; border-radius: 4px; color: var(--accent); letter-spacing: 0.05em; }
.os-btn { font-family: 'DM Mono', monospace; font-size: 12px; font-weight: 500; padding: 6px 14px; border-radius: 6px; border: 1px solid var(--accent); background: transparent; color: var(--accent); cursor: pointer; letter-spacing: 0.08em; transition: background 0.15s; }
.os-btn:hover { background: rgba(200,240,96,0.1); }

/* ── Main layout ── */
main { max-width: 1440px; margin: 0 auto; padding: 20px 24px; }
.stats-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 20px; }
.main-grid { display: grid; grid-template-columns: 1fr 300px; gap: 20px; margin-bottom: 20px; }
.bottom-grid { display: grid; grid-template-columns: 1fr 1fr 260px; gap: 20px; }

/* ── Cards ── */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 20px; }
.card-title { font-family: 'DM Mono', monospace; font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 14px; }

/* ── Stat cards ── */
.stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
.stat-label { font-family: 'DM Mono', monospace; font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 6px; }
.stat-value { font-family: 'Bebas Neue', cursive; font-size: 34px; color: var(--text); line-height: 1; }
.stat-value.accent { color: var(--accent); }
.stat-value.green { color: var(--accent2); }
.stat-sub { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--muted); margin-top: 4px; }

/* ── Week nav ── */
.week-nav { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 14px; }
.week-btn {
  font-family: 'DM Mono', monospace; font-size: 10px; font-weight: 500;
  padding: 3px 7px; border-radius: 4px; border: 1px solid var(--border);
  background: var(--surface2); color: var(--muted); cursor: pointer; transition: all 0.15s;
}
.week-btn:hover { border-color: var(--border2); color: var(--text); }
.week-btn.active { background: var(--accent); color: #0d0f0e; border-color: var(--accent); }
.week-btn.done { background: rgba(74,222,128,0.12); color: var(--accent2); border-color: rgba(74,222,128,0.3); }
.week-btn.active.done { background: var(--accent2); color: #0d0f0e; border-color: var(--accent2); }

/* ── Week focus ── */
.week-focus { background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 12px 14px; margin-bottom: 14px; }
.week-focus-title { font-family: 'Bebas Neue', cursive; font-size: 18px; color: var(--text); letter-spacing: 0.04em; margin-bottom: 4px; }
.week-focus-desc { font-size: 12px; color: var(--muted); line-height: 1.5; }

/* ── Progress bar ── */
.progress-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.progress-bar { flex: 1; height: 4px; background: var(--surface2); border-radius: 2px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.3s; }
.progress-label { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted); white-space: nowrap; }

/* ── Task items ── */
.task-list { list-style: none; }
.task-item { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--border); }
.task-item:last-child { border-bottom: none; }
.task-check { accent-color: var(--accent2); width: 15px; height: 15px; cursor: pointer; flex-shrink: 0; }
.task-text { flex: 1; font-size: 13px; cursor: pointer; user-select: none; transition: color 0.15s; }
.task-text:hover { color: var(--accent); }
.task-text.done { text-decoration: line-through; color: var(--muted); }
.task-text.done:hover { color: var(--muted); }
.pencil-btn { opacity: 0; background: none; border: none; color: var(--muted); cursor: pointer; font-size: 11px; padding: 2px 4px; border-radius: 3px; transition: opacity 0.2s, color 0.15s; flex-shrink: 0; }
.task-item:hover .pencil-btn { opacity: 1; }
.pencil-btn:hover { color: var(--accent); }

/* ── Task edit row ── */
.task-edit-row { display: flex; align-items: center; gap: 6px; padding: 6px 0; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.task-edit-input { flex: 1; min-width: 120px; background: var(--surface2); border: 1px solid var(--accent); color: var(--text); border-radius: 5px; padding: 5px 8px; font-family: 'DM Sans', sans-serif; font-size: 13px; outline: none; }
.task-edit-select { background: var(--surface2); border: 1px solid var(--border); color: var(--text); border-radius: 5px; padding: 5px 8px; font-family: 'DM Sans', sans-serif; font-size: 12px; outline: none; cursor: pointer; }

/* ── Add task row ── */
.add-task-row { display: flex; gap: 6px; margin-top: 12px; align-items: center; }
.add-task-input { flex: 1; background: var(--surface2); border: 1px solid var(--border); color: var(--text); border-radius: 5px; padding: 7px 10px; font-family: 'DM Sans', sans-serif; font-size: 13px; outline: none; }
.add-task-input:focus { border-color: var(--accent); }
.add-task-select { background: var(--surface2); border: 1px solid var(--border); color: var(--text); border-radius: 5px; padding: 7px 10px; font-family: 'DM Sans', sans-serif; font-size: 12px; outline: none; cursor: pointer; }

/* ── Badges ── */
.badge { font-family: 'DM Mono', monospace; font-size: 9px; font-weight: 500; padding: 2px 6px; border-radius: 3px; text-transform: uppercase; letter-spacing: 0.06em; white-space: nowrap; flex-shrink: 0; }
.tag-admin { background: rgba(167,139,250,0.15); color: var(--purple); }
.tag-sales { background: rgba(96,165,250,0.15); color: var(--blue); }
.tag-build { background: rgba(200,240,96,0.15); color: var(--accent); }
.tag-learn { background: rgba(45,212,191,0.15); color: var(--teal); }
.tag-content { background: rgba(249,115,22,0.15); color: #fb923c; }
.stage-cold { background: var(--surface2); color: var(--muted); cursor: pointer; border: 1px solid var(--border); }
.stage-warm { background: rgba(245,158,11,0.12); color: var(--warn); cursor: pointer; border: 1px solid rgba(245,158,11,0.25); }
.stage-hot { background: rgba(248,113,113,0.12); color: var(--danger); cursor: pointer; border: 1px solid rgba(248,113,113,0.25); }
.stage-won { background: rgba(74,222,128,0.12); color: var(--accent2); cursor: pointer; border: 1px solid rgba(74,222,128,0.25); }
.status-prospect { background: rgba(96,165,250,0.12); color: var(--blue); }
.status-active { background: rgba(74,222,128,0.12); color: var(--accent2); }
.status-completed { background: rgba(167,139,250,0.12); color: var(--purple); }

/* ── Milestone map ── */
.milestone-card { overflow-y: auto; }
.milestone-map-inner { position: relative; padding-left: 28px; }
.milestone-track { position: absolute; left: 5px; top: 8px; bottom: 8px; width: 2px; background: var(--border2); border-radius: 1px; }
.milestone-item { position: relative; padding-bottom: 22px; }
.milestone-item:last-child { padding-bottom: 0; }
.milestone-dot { position: absolute; left: -23px; top: 3px; width: 12px; height: 12px; border-radius: 50%; background: var(--border2); border: 2px solid var(--border2); transition: all 0.3s; }
.milestone-dot.passed { background: var(--accent2); border-color: var(--accent2); }
.milestone-dot.current { background: var(--accent2); border-color: var(--accent2); box-shadow: 0 0 10px var(--accent2), 0 0 20px rgba(74,222,128,0.4); }
.milestone-phase { font-family: 'DM Mono', monospace; font-size: 9px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 2px; }
.milestone-week { font-family: 'DM Mono', monospace; font-size: 9px; color: var(--border2); margin-bottom: 4px; }
.milestone-title { font-size: 12px; font-weight: 600; color: var(--text); margin-bottom: 2px; }
.milestone-title.passed { color: var(--accent2); }
.milestone-title.current { color: var(--accent); }
.milestone-sub { font-size: 11px; color: var(--muted); }

/* ── Buttons ── */
.btn { padding: 7px 13px; border-radius: 5px; border: none; cursor: pointer; font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 500; transition: all 0.15s; }
.btn-primary { background: var(--accent); color: #0d0f0e; }
.btn-primary:hover { background: #d4f570; }
.btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
.btn-secondary:hover { border-color: var(--border2); }
.btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
.btn-ghost:hover { color: var(--text); border-color: var(--border2); }
.btn-danger { background: rgba(248,113,113,0.12); color: var(--danger); border: 1px solid rgba(248,113,113,0.25); }
.btn-danger:hover { background: rgba(248,113,113,0.2); }
.btn-sm { padding: 4px 9px; font-size: 11px; }
.btn-xs { padding: 2px 7px; font-size: 10px; }

/* ── Panel header/section ── */
.section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.section-title { font-family: 'DM Mono', monospace; font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }

/* ── Prospects ── */
.prospect-item { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--border); }
.prospect-item:last-child { border-bottom: none; }
.prospect-name { flex: 1; font-size: 13px; font-weight: 500; }
.prospect-trade { font-size: 11px; color: var(--muted); }
.prospect-del { background: none; border: none; color: var(--border2); cursor: pointer; font-size: 14px; padding: 2px 4px; transition: color 0.15s; }
.prospect-del:hover { color: var(--danger); }

/* ── Inline add forms ── */
.inline-form { background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 12px; margin-bottom: 12px; display: flex; flex-direction: column; gap: 8px; }
.inline-form-row { display: flex; gap: 8px; }
.form-input { background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 5px; padding: 7px 10px; font-family: 'DM Sans', sans-serif; font-size: 13px; outline: none; width: 100%; }
.form-input:focus { border-color: var(--accent); }
.form-select { background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 5px; padding: 7px 10px; font-family: 'DM Sans', sans-serif; font-size: 12px; outline: none; cursor: pointer; width: 100%; }
.form-select:focus { border-color: var(--accent); }
.form-textarea { background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 5px; padding: 7px 10px; font-family: 'DM Sans', sans-serif; font-size: 13px; outline: none; width: 100%; resize: vertical; min-height: 70px; }
.form-textarea:focus { border-color: var(--accent); }

/* ── Income entries ── */
.income-item { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--border); }
.income-item:last-child { border-bottom: none; }
.income-label { flex: 1; font-size: 13px; }
.income-type-tag { font-family: 'DM Mono', monospace; font-size: 9px; padding: 2px 5px; border-radius: 3px; background: var(--surface2); color: var(--muted); white-space: nowrap; }
.income-date { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--muted); white-space: nowrap; }
.income-amount { font-family: 'Bebas Neue', cursive; font-size: 15px; white-space: nowrap; }
.income-audit { color: var(--accent); }
.income-retainer { color: var(--accent2); }
.income-contracting { color: var(--blue); }
.income-other { color: var(--muted); }
.income-del { background: none; border: none; color: var(--border2); cursor: pointer; font-size: 14px; padding: 2px 4px; transition: color 0.15s; }
.income-del:hover { color: var(--danger); }
.income-summary { background: var(--surface2); border-radius: 6px; padding: 10px 12px; margin-top: 10px; }
.income-summary-row { display: flex; justify-content: space-between; align-items: center; font-size: 12px; margin-bottom: 4px; }
.income-summary-label { color: var(--muted); }
.income-summary-val { font-family: 'Bebas Neue', cursive; font-size: 16px; }
.income-mrr-val { color: var(--accent2); }
.income-total-val { color: var(--accent); }
.income-target-bar { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; margin-top: 8px; }
.income-target-fill { height: 100%; background: linear-gradient(90deg, var(--accent2), var(--accent)); border-radius: 2px; transition: width 0.3s; }
.income-target-label { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--muted); margin-top: 4px; text-align: right; }

/* ── Tools ── */
.tools-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tool-card { background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; }
.tool-name { font-size: 12px; font-weight: 600; margin-bottom: 3px; }
.tool-status { font-family: 'DM Mono', monospace; font-size: 10px; }
.tool-active { color: var(--accent2); }
.tool-pending { color: var(--warn); }
.tool-learning { color: var(--blue); }

/* ── OS Overlay + Panel ── */
#os-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 200; }
#os-overlay.open { display: block; }
#os-panel {
  position: fixed; right: 0; top: 0; bottom: 0; width: 440px;
  background: var(--surface); border-left: 1px solid var(--border);
  z-index: 201; display: flex; flex-direction: column;
  transform: translateX(100%); transition: transform 0.28s ease; overflow: hidden;
}
#os-panel.open { transform: translateX(0); }
.panel-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.panel-title { font-family: 'Bebas Neue', cursive; font-size: 20px; color: var(--accent); letter-spacing: 0.06em; }
.panel-close { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 22px; line-height: 1; padding: 2px 6px; border-radius: 4px; transition: color 0.15s; }
.panel-close:hover { color: var(--text); }
.panel-tabs { display: flex; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.panel-tab { flex: 1; padding: 10px; background: none; border: none; color: var(--muted); font-family: 'DM Mono', monospace; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.15s; }
.panel-tab:hover { color: var(--text); }
.panel-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
#panel-body { flex: 1; overflow-y: auto; padding: 20px; }

/* ── OS Panel content ── */
.os-stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 18px; }
.os-stat-card { background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 12px; }
.os-stat-label { font-family: 'DM Mono', monospace; font-size: 9px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 4px; }
.os-stat-val { font-family: 'Bebas Neue', cursive; font-size: 26px; color: var(--text); }
.os-section { margin-bottom: 20px; }
.os-section-title { font-family: 'DM Mono', monospace; font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 10px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
.quick-link { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--blue); text-decoration: none; padding: 5px 10px; border-radius: 5px; border: 1px solid rgba(96,165,250,0.2); background: rgba(96,165,250,0.05); transition: all 0.15s; margin-right: 6px; margin-bottom: 6px; }
.quick-link:hover { background: rgba(96,165,250,0.12); border-color: rgba(96,165,250,0.4); }
.sql-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px; padding: 10px; font-family: 'DM Mono', monospace; font-size: 10px; color: var(--muted); line-height: 1.6; }

/* ── Client cards ── */
.client-card { background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 12px; margin-bottom: 8px; }
.client-card-header { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 6px; }
.client-name { font-size: 13px; font-weight: 600; flex: 1; }
.client-meta { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.client-detail { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--muted); }
.client-actions { display: flex; gap: 6px; }

/* ── SOP cards ── */
.sop-card { background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 12px; margin-bottom: 8px; }
.sop-card-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.sop-title-input { flex: 1; background: transparent; border: none; border-bottom: 1px solid var(--border); color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 600; padding: 3px 4px; outline: none; transition: border-color 0.15s; }
.sop-title-input:focus { border-bottom-color: var(--accent); }
.sop-body-textarea { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 4px; padding: 8px; font-family: 'DM Mono', monospace; font-size: 11px; line-height: 1.6; resize: vertical; min-height: 80px; outline: none; transition: border-color 0.15s; }
.sop-body-textarea:focus { border-color: var(--accent); }
.sop-status-select { background: var(--surface2); border: 1px solid var(--border); color: var(--text); border-radius: 4px; padding: 3px 7px; font-family: 'DM Mono', monospace; font-size: 10px; outline: none; cursor: pointer; }

/* ── Note cards ── */
.note-card { background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 12px; margin-bottom: 8px; transition: border-color 0.2s; }
.note-card.pinned { border-color: rgba(200,240,96,0.35); background: rgba(200,240,96,0.03); }
.note-card-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.note-title-input { flex: 1; background: transparent; border: none; border-bottom: 1px solid var(--border); color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 600; padding: 3px 4px; outline: none; transition: border-color 0.15s; }
.note-title-input:focus { border-bottom-color: var(--accent); }
.note-body-textarea { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 4px; padding: 8px; font-family: 'DM Sans', sans-serif; font-size: 12px; line-height: 1.6; resize: vertical; min-height: 70px; outline: none; transition: border-color 0.15s; }
.note-body-textarea:focus { border-color: var(--accent); }
.pin-btn { background: none; border: none; cursor: pointer; font-size: 13px; padding: 2px 5px; border-radius: 3px; transition: opacity 0.15s; }
.pin-btn.pinned { opacity: 1; }
.pin-btn.unpinned { opacity: 0.3; }
.pin-btn:hover { opacity: 1; }

// ── Sync status ────────────────────────────────────────────────────────────
function setSyncStatus(s) {
  var el = document.getElementById('sync-status');
  if (!el) return;
  var labels = { loading:'● Loading', saving:'● Saving', saved:'● Saved', failed:'● Save failed' };
  var classes = { loading:'sync-loading', saving:'sync-saving', saved:'sync-saved', failed:'sync-failed' };
  el.textContent = labels[s] || s;
  el.className = 'sync-status ' + (classes[s] || '');
}

// ── localStorage ───────────────────────────────────────────────────────────
function saveLocal() {
  try { localStorage.setItem('structtech_state', JSON.stringify(state)); } catch(e) {}
}
function loadLocal() {
  try {
    var raw = localStorage.getItem('structtech_state');
    return raw ? JSON.parse(raw) : null;
  } catch(e) { return null; }
}

// ── Apply loaded state ─────────────────────────────────────────────────────
function applyState(data) {
  if (data.task_state)     state.task_state     = data.task_state     || {};
  if (data.prospects)      state.prospects      = data.prospects      || [];
  if (data.income_entries) state.income_entries = data.income_entries || [];
  if (data.current_week)   state.current_week   = data.current_week   || 1;
  if (data.os_data)        state.os_data        = data.os_data        || {};
  if (!state.os_data)           state.os_data = {};
  if (!state.os_data.clients)   state.os_data.clients = [];
  if (!state.os_data.sops || state.os_data.sops.length === 0)   state.os_data.sops  = JSON.parse(JSON.stringify(DEFAULT_SOPS));
  if (!state.os_data.notes || state.os_data.notes.length === 0) state.os_data.notes = JSON.parse(JSON.stringify(DEFAULT_NOTES));
  viewWeek = state.current_week;
}

// ── Supabase load ──────────────────────────────────────────────────────────
async function loadState() {
  setSyncStatus('loading');
  var loaded = false;
  // Try with os_data
  try {
    var r = await fetch(SUPABASE_URL + '/rest/v1/structtech_state?id=eq.jacob&select=task_state,prospects,income_entries,current_week,os_data', { headers: SB_HEADERS });
    if (r.ok) {
      var rows = await r.json();
      if (rows && rows.length > 0) { applyState(rows[0]); loaded = true; }
      else if (rows && rows.length === 0) { loaded = true; } // row doesn't exist yet, use defaults
    }
  } catch(e) {}
  // Retry without os_data if first attempt failed
  if (!loaded) {
    try {
      var r2 = await fetch(SUPABASE_URL + '/rest/v1/structtech_state?id=eq.jacob&select=task_state,prospects,income_entries,current_week', { headers: SB_HEADERS });
      if (r2.ok) {
        var rows2 = await r2.json();
        if (rows2 && rows2.length > 0) { applyState(rows2[0]); loaded = true; }
        else { loaded = true; }
      }
    } catch(e) {}
  }
  // localStorage fallback
  if (!loaded) {
    var local = loadLocal();
    if (local) { applyState(local); loaded = true; }
  }
  // Apply defaults if nothing was loaded
  if (!state.os_data.sops || state.os_data.sops.length === 0)   state.os_data.sops  = JSON.parse(JSON.stringify(DEFAULT_SOPS));
  if (!state.os_data.notes || state.os_data.notes.length === 0) state.os_data.notes = JSON.parse(JSON.stringify(DEFAULT_NOTES));
  setSyncStatus('saved');
}

// ── Supabase save ──────────────────────────────────────────────────────────
async function saveState() {
  setSyncStatus('saving');
  var body = JSON.stringify({
    id: 'jacob',
    task_state: state.task_state,
    prospects: state.prospects,
    income_entries: state.income_entries,
    current_week: state.current_week,
    os_data: state.os_data,
    updated_at: new Date().toISOString()
  });
  try {
    var r = await fetch(SUPABASE_URL + '/rest/v1/structtech_state?id=eq.jacob', {
      method: 'PATCH',
      headers: Object.assign({}, SB_HEADERS, { 'Content-Type': 'application/json', 'Prefer': 'return=minimal' }),
      body: body
    });
    if (r.ok) { saveLocal(); setSyncStatus('saved'); }
    else { throw new Error('HTTP ' + r.status); }
  } catch(e) { saveLocal(); setSyncStatus('failed'); }
}

function scheduleSave() {
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(saveState, 600);
}

// ── Data helpers ───────────────────────────────────────────────────────────
function getTasksForWeek(weekNum) {
  var weekData = WEEKS[weekNum - 1];
  if (!weekData) return [];
  var tasks = [];
  weekData.tasks.forEach(function(t) {
    if (!state.task_state['deleted_' + t.id]) {
      var ov = state.task_state['override_' + t.id];
      tasks.push({ id: t.id, text: ov ? ov.text : t.text, tag: ov ? ov.tag : t.tag, done: !!state.task_state[t.id], custom: false });
    }
  });
  var custom = state.task_state['custom_w' + weekNum] || [];
  custom.forEach(function(t) {
    tasks.push({ id: t.id, text: t.text, tag: t.tag, done: !!state.task_state[t.id], custom: true });
  });
  return tasks;
}

function isWeekComplete(weekNum) {
  var tasks = getTasksForWeek(weekNum);
  return tasks.length > 0 && tasks.every(function(t) { return t.done; });
}

function calcIncome() {
  var total = 0, mrr = 0;
  state.income_entries.forEach(function(e) {
    var amt = parseFloat(e.amount) || 0;
    total += amt;
    if (e.type === 'Retainer') mrr += amt;
  });
  return { total: total, mrr: mrr };
}

    '</div>';

  // Task list
  var listHtml = '<ul class="task-list">';
  tasks.forEach(function(t) {
    if (editingTask === t.id) listHtml += renderTaskItemEdit(t);
    else listHtml += renderTaskItemView(t);
  });
  listHtml += '</ul>';

  // Add task row
  var addHtml = '<div class="add-task-row">' +
    '<input type="text" class="add-task-input" id="new-task-input" placeholder="Add a task..." onkeydown="if(event.key===\'Enter\')addTask()">' +
    '<select class="add-task-select" id="new-task-tag">' +
    '<option value="admin">admin</option><option value="sales">sales</option>' +
    '<option value="build">build</option><option value="learn">learn</option>' +
    '<option value="content">content</option>' +
    '</select>' +
    '<button class="btn btn-primary btn-sm" onclick="addTask()">+ Add</button>' +
    '</div>';

  el.innerHTML = '<div class="card-title">Weekly Task Board</div>' + navHtml + focusHtml + progHtml + listHtml + addHtml;

  if (editingTask) {
    var inp = document.getElementById('edit-input-' + editingTask);
    if (inp) { inp.focus(); inp.select(); }
  }
}

// ── Event handlers: Tasks ──────────────────────────────────────────────────
function toggleTask(id) {
  state.task_state[id] = !state.task_state[id];
  scheduleSave();
  renderTaskBoard();
  renderStats();
  renderWeekNavOnly();
}

function renderWeekNavOnly() {
  var nav = document.querySelector('.week-nav');
  if (!nav) return;
  var html = '';
  for (var i = 1; i <= 16; i++) html += renderWeekBtn(i);
  nav.innerHTML = html;
}

function startEditTask(id) {
  editingTask = id;
  renderTaskBoard();
}

function handleEditKey(e, id) {
  if (e.key === 'Enter') saveEditTask(id);
  if (e.key === 'Escape') cancelEditTask();
}

function saveEditTask(id) {
  var inp = document.getElementById('edit-input-' + id);
  var tagEl = document.getElementById('edit-tag-' + id);
  var text = inp ? inp.value.trim() : '';
  var tag = tagEl ? tagEl.value : 'admin';
  if (!text) { cancelEditTask(); return; }
  // Check if custom task
  var isCustom = false;
  for (var w = 1; w <= 16; w++) {
    var ct = state.task_state['custom_w' + w] || [];
    var idx = -1;
    for (var i = 0; i < ct.length; i++) { if (ct[i].id === id) { idx = i; break; } }
    if (idx >= 0) { ct[idx].text = text; ct[idx].tag = tag; state.task_state['custom_w' + w] = ct; isCustom = true; break; }
  }
  if (!isCustom) {
    state.task_state['override_' + id] = { text: text, tag: tag };
  }
  editingTask = null;
  scheduleSave();
  renderTaskBoard();
}

function cancelEditTask() {
  editingTask = null;
  renderTaskBoard();
}

function deleteTask(id) {
  var isCustom = false;
  for (var w = 1; w <= 16; w++) {
    var ct = state.task_state['custom_w' + w] || [];
    var filtered = ct.filter(function(t) { return t.id !== id; });
    if (filtered.length !== ct.length) { state.task_state['custom_w' + w] = filtered; isCustom = true; break; }
  }
  if (!isCustom) {
    state.task_state['deleted_' + id] = true;
    delete state.task_state['override_' + id];
    delete state.task_state[id];
  }
  editingTask = null;
  scheduleSave();
  renderTaskBoard();
  renderStats();
}

function addTask() {
  var inp = document.getElementById('new-task-input');
  var tagEl = document.getElementById('new-task-tag');
  var text = inp ? inp.value.trim() : '';
  if (!text) return;
  var tag = tagEl ? tagEl.value : 'admin';
  var newTask = { id: 'ct_' + genId(), text: text, tag: tag };
  var key = 'custom_w' + viewWeek;
  if (!state.task_state[key]) state.task_state[key] = [];
  state.task_state[key].push(newTask);
  scheduleSave();
  renderTaskBoard();
  renderStats();
}

function setWeek(n) {
  viewWeek = n;
  state.current_week = n;
  editingTask = null;
  scheduleSave();
  renderHeader();
  renderStats();
  renderTaskBoard();
  renderMilestones();
}

// ── Event handlers: Prospects ──────────────────────────────────────────────
function toggleAddProspect() {
  showAddProspect = !showAddProspect;
  renderProspects();
  if (showAddProspect) {
    setTimeout(function() { var el = document.getElementById('np-name'); if (el) el.focus(); }, 50);
  }
}

function cancelAddProspect() { showAddProspect = false; renderProspects(); }

function saveProspect() {
  var name = (document.getElementById('np-name') || {}).value || '';
  var type = (document.getElementById('np-trade') || {}).value || '';
  var stage = (document.getElementById('np-stage') || {}).value || 'Cold';
  if (!name.trim()) return;
  state.prospects.push({ name: name.trim(), type: type.trim(), stage: stage });
  showAddProspect = false;
  scheduleSave();
  renderProspects();
  renderStats();
}

function cycleStage(idx) {
  var stages = ['Cold','Warm','Hot','Won'];
  var p = state.prospects[idx];
  if (!p) return;
  var i = stages.indexOf(p.stage);
  p.stage = stages[(i + 1) % stages.length];
  scheduleSave();
  renderProspects();
}

function deleteProspect(idx) {
  state.prospects.splice(idx, 1);
  scheduleSave();
  renderProspects();
  renderStats();
}

// ── Event handlers: Income ─────────────────────────────────────────────────
function toggleAddIncome() {
  showAddIncome = !showAddIncome;
  renderIncome();
  if (showAddIncome) {
    setTimeout(function() { var el = document.getElementById('ni-label'); if (el) el.focus(); }, 50);
  }
}

function cancelAddIncome() { showAddIncome = false; renderIncome(); }

function saveIncome() {
  var type  = (document.getElementById('ni-type')   || {}).value || 'Other';
  var label = (document.getElementById('ni-label')  || {}).value || '';
  var amt   = parseFloat((document.getElementById('ni-amount') || {}).value) || 0;
  if (!label.trim() || amt <= 0) return;
  state.income_entries.push({ id: genId(), label: label.trim(), amount: amt, type: type, date: new Date().toISOString() });
  showAddIncome = false;
  scheduleSave();
  renderIncome();
  renderStats();
}

function deleteIncome(id) {
  state.income_entries = state.income_entries.filter(function(e) { return e.id !== id; });
  scheduleSave();
  renderIncome();
  renderStats();
}

}

function closeOS() {
  osOpen = false;
  document.getElementById('os-panel').classList.remove('open');
  document.getElementById('os-overlay').classList.remove('open');
}

function switchOSTab(tab) {
  osTab = tab;
  showAddClient = false;
  editingClientId = null;
  renderOS();
}

// ── Event handlers: Clients ────────────────────────────────────────────────
function toggleAddClient() {
  showAddClient = !showAddClient;
  editingClientId = showAddClient ? 'new' : null;
  renderOS();
  if (showAddClient) {
    setTimeout(function() { var el = document.getElementById('cf-name-new'); if (el) el.focus(); }, 50);
  }
}

function cancelClientForm() {
  showAddClient = false;
  editingClientId = null;
  renderOS();
}

function saveClient(idStr) {
  var name     = (document.getElementById('cf-name-' + idStr)     || {}).value || '';
  var trade    = (document.getElementById('cf-trade-' + idStr)    || {}).value || '';
  var location = (document.getElementById('cf-location-' + idStr) || {}).value || '';
  var status   = (document.getElementById('cf-status-' + idStr)   || {}).value || 'prospect';
  var phase    = (document.getElementById('cf-phase-' + idStr)    || {}).value || 'Phase I';
  var auditFee = (document.getElementById('cf-audit-' + idStr)    || {}).value || '';
  var retainer = (document.getElementById('cf-retainer-' + idStr) || {}).value || '';
  var notes    = (document.getElementById('cf-notes-' + idStr)    || {}).value || '';
  if (!name.trim()) return;
  if (idStr === 'new') {
    state.os_data.clients.push({ id: genId(), name: name.trim(), trade: trade.trim(), location: location.trim(), status: status, phase: phase, auditFee: auditFee, retainer: retainer, notes: notes.trim() });
  } else {
    var numId = parseInt(idStr);
    var c = state.os_data.clients.find(function(x) { return x.id === numId; });
    if (c) { c.name = name.trim(); c.trade = trade.trim(); c.location = location.trim(); c.status = status; c.phase = phase; c.auditFee = auditFee; c.retainer = retainer; c.notes = notes.trim(); }
  }
  showAddClient = false;
  editingClientId = null;
  scheduleSave();
  renderOS();
  renderStats();
}

function startEditClient(id) {
  editingClientId = id;
  showAddClient = false;
  renderOS();
  setTimeout(function() { var el = document.getElementById('cf-name-' + id); if (el) el.focus(); }, 50);
}

function deleteClient(id) {
  state.os_data.clients = state.os_data.clients.filter(function(c) { return c.id !== id; });
  scheduleSave();
  renderOS();
  renderStats();
}

// ── Event handlers: SOPs ───────────────────────────────────────────────────
function addSOP() {
  state.os_data.sops.push({ id: genId(), title: 'New SOP', status: 'draft', body: '' });
  scheduleSave();
  renderOS();
}

function deleteSOP(id) {
  state.os_data.sops = state.os_data.sops.filter(function(s) { return s.id !== id; });
  scheduleSave();
  renderOS();
}

function updateSOP(id, field, value) {
  var s = state.os_data.sops.find(function(x) { return x.id === id; });
  if (s) { s[field] = value; scheduleSave(); if (field === 'status') renderOS(); }
}

// ── Event handlers: Notes ──────────────────────────────────────────────────
function addNote() {
  state.os_data.notes.push({ id: genId(), title: 'New Note', pinned: false, body: '' });
  scheduleSave();
  renderOS();
}

function deleteNote(id) {
  state.os_data.notes = state.os_data.notes.filter(function(n) { return n.id !== id; });
  scheduleSave();
  renderOS();
}

function updateNote(id, field, value) {
  var n = state.os_data.notes.find(function(x) { return x.id === id; });
  if (n) { n[field] = value; scheduleSave(); }
}

function togglePinNote(id) {
  var n = state.os_data.notes.find(function(x) { return x.id === id; });
  if (n) { n.pinned = !n.pinned; scheduleSave(); renderOS(); }
}

// ── HTML escaping helpers ──────────────────────────────────────────────────
function escHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escAttr(str) {
  if (str === null || str === undefined) return '';
  return String(str).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// ── Init ───────────────────────────────────────────────────────────────────
async function init() {
  await loadState();
  renderAll();
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
