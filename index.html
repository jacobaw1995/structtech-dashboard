// ── Data helpers ───────────────────────────────────────────────────────────
function getTasksForWeek(weekNum) {
  var weekData = WEEKS[weekNum - 1];
  if (!weekData) return [];
  var tasks = [];
  weekData.tasks.forEach(function(t) {
    if (!state.task_state['deleted_' + t.id]) {
      var ov = state.task_state['override_' + t.id];
      tasks.push({ id: t.id, text: ov ? ov.text : t.text, tag: ov ? ov.tag : t.tag, done: !!state.task_state[t.id], custom: false });
    }
  });
  var custom = state.task_state['custom_w' + weekNum] || [];
  custom.forEach(function(t) {
    tasks.push({ id: t.id, text: t.text, tag: t.tag, done: !!state.task_state[t.id], custom: true });
  });
  return tasks;
}

function isWeekComplete(weekNum) {
  var tasks = getTasksForWeek(weekNum);
  return tasks.length > 0 && tasks.every(function(t) { return t.done; });
}

// ── Render: Header ─────────────────────────────────────────────────────────
function renderHeader() {

  var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  document.getElementById('header-date').textContent = days[d.getDay()] + ', ' + months[d.getMonth()] + ' ' + d.getDate();
  document.getElementById('week-badge').textContent = 'W' + state.current_week;
}

// ── Render: Stats ──────────────────────────────────────────────────────────
function renderStats() {
  var el = document.getElementById('stats-row');
  if (!el) return;
  var tasks = getTasksForWeek(state.current_week);
  var done = tasks.filter(function(t) { return t.done; }).length;
  var income = calcIncome();
  function card(label, val, cls, sub) {
    return '<div class="stat-card"><div class="stat-label">' + label + '</div>' +
      '<div class="stat-value ' + (cls || '') + '">' + val + '</div>' +
      (sub ? '<div class="stat-sub">' + sub + '</div>' : '') + '</div>';
  }
  el.innerHTML =
    card('Active Week', state.current_week, 'accent', 'of 16') +
    card('Tasks Complete', done + '/' + tasks.length, '', 'this week') +
    card('Prospects', state.prospects.length, '', 'in pipeline') +
    card('Revenue MTD', '$' + Math.round(income.total).toLocaleString(), 'green', 'total logged') +
    card('Retainer MRR', '$' + Math.round(income.mrr).toLocaleString(), 'accent', 'recurring');
}

// ── Render: Week nav button ────────────────────────────────────────────────
function renderWeekBtn(n) {
  var cls = 'week-btn';
  if (n === viewWeek) cls += ' active';
  if (isWeekComplete(n)) cls += ' done';
  return '<button class="' + cls + '" onclick="setWeek(' + n + ')">W' + n + '</button>';
}

// ── Render: Task item (view mode) ──────────────────────────────────────────
function renderTaskItemView(t) {
  var tagCls = 'badge tag-' + t.tag;
  var textCls = 'task-text' + (t.done ? ' done' : '');
  return '<li class="task-item" id="ti-' + t.id + '">' +
    '<input type="checkbox" class="task-check"' + (t.done ? ' checked' : '') + ' onchange="toggleTask(\'' + t.id + '\')">' +
    '<span class="' + textCls + '" onclick="startEditTask(\'' + t.id + '\')">' + escHtml(t.text) + '</span>' +
    '<span class="' + tagCls + '">' + t.tag + '</span>' +
    '<button class="pencil-btn" onclick="startEditTask(\'' + t.id + '\')" title="Edit">&#9999;</button>' +
    '</li>';
}

// ── Render: Task item (edit mode) ──────────────────────────────────────────
function renderTaskItemEdit(t) {
  var tags = ['admin', 'sales', 'build', 'learn', 'content'];
  var opts = '';
  tags.forEach(function(tag) {
    opts += '<option value="' + tag + '"' + (t.tag === tag ? ' selected' : '') + '>' + tag + '</option>';
  });
  return '<li class="task-edit-row" id="ti-' + t.id + '">' +
    '<input type="text" class="task-edit-input" id="edit-input-' + t.id + '" value="' + escAttr(t.text) + '" onkeydown="handleEditKey(event,\'' + t.id + '\')">' +
    '<select class="task-edit-select" id="edit-tag-' + t.id + '">' + opts + '</select>' +
    '<button class="btn btn-primary btn-sm" onclick="saveEditTask(\'' + t.id + '\')">Save</button>' +
    '<button class="btn btn-ghost btn-sm" onclick="cancelEditTask()">Cancel</button>' +
    '<button class="btn btn-danger btn-sm" onclick="deleteTask(\'' + t.id + '\')">Delete</button>' +
    '</li>';
}

// ── Render: Task board ─────────────────────────────────────────────────────
function renderTaskBoard() {
  var el = document.getElementById('task-board');
  if (!el) return;
  var weekData = WEEKS[viewWeek - 1];
  var tasks = getTasksForWeek(viewWeek);
  var done = tasks.filter(function(t) { return t.done; }).length;
  var pct = tasks.length ? Math.round((done / tasks.length) * 100) : 0;

  var navHtml = '<div class="week-nav">';
  for (var i = 1; i <= 16; i++) navHtml += renderWeekBtn(i);
  navHtml += '</div>';

  var focusHtml = '<div class="week-focus">' +
    '<div class="week-focus-title">W' + viewWeek + ' \u2014 ' + escHtml(weekData.mission) + '</div>' +
    '<div class="week-focus-desc">' + escHtml(weekData.desc) + '</div>' +
    '</div>';

  var progHtml = '<div class="progress-row">' +
    '<div class="progress-bar"><div class="progress-fill" style="width:' + pct + '%"></div></div>' +
    '<span class="progress-label">' + done + '/' + tasks.length + ' &nbsp; ' + pct + '%</span>' +
    '</div>';

  var listHtml = '<ul class="task-list">';
  tasks.forEach(function(t) {
    if (editingTask === t.id) listHtml += renderTaskItemEdit(t);
    else listHtml += renderTaskItemView(t);
  });
  listHtml += '</ul>';

  var addHtml = '<div class="add-task-row">' +
    '<input type="text" class="add-task-input" id="new-task-input" placeholder="Add a task..." onkeydown="if(event.key===\'Enter\')addTask()">' +
    '<select class="add-task-select" id="new-task-tag">' +
    '<option value="admin">admin</option><option value="sales">sales</option>' +
    '<option value="build">build</option><option value="learn">learn</option>' +
    '<option value="content">content</option>' +
    '</select>' +
    '<button class="btn btn-primary btn-sm" onclick="addTask()">+ Add</button>' +
    '</div>';

  el.innerHTML = '<div class="card-title">Weekly Task Board</div>' + navHtml + focusHtml + progHtml + listHtml + addHtml;

  if (editingTask) {
    var inp = document.getElementById('edit-input-' + editingTask);
    if (inp) { inp.focus(); inp.select(); }
  }
}

// ── Render: Milestone item ─────────────────────────────────────────────────
function renderMilestoneItem(m) {
  var dotCls = 'milestone-dot';
  var titleCls = 'milestone-title';
  if (m.week < state.current_week)       { dotCls += ' passed'; titleCls += ' passed'; }
  else if (m.week === state.current_week) { dotCls += ' current'; titleCls += ' current'; }
  return '<div class="milestone-item">' +
    '<div class="' + dotCls + '"></div>' +
    '<div class="milestone-phase">' + m.phase + '</div>' +
    '<div class="milestone-week">Week ' + m.week + '</div>' +
    '<div class="' + titleCls + '">' + escHtml(m.title) + '</div>' +
    '<div class="milestone-sub">' + escHtml(m.sub) + '</div>' +
    '</div>';
}

    addFormHtml = '<div class="inline-form">' +
      '<select class="form-select" id="ni-type"><option>Audit fee</option><option>Retainer</option><option>Contracting</option><option>Other</option></select>' +
      '<input class="form-input" id="ni-label" placeholder="Label / Client">' +
      '<div class="inline-form-row">' +
      '<input class="form-input" id="ni-amount" type="number" placeholder="Amount ($)" min="0">' +
      '<button class="btn btn-primary btn-sm" onclick="saveIncome()">Log</button>' +
      '<button class="btn btn-ghost btn-sm" onclick="cancelAddIncome()">Cancel</button>' +
      '</div></div>';
  }
  var inc = calcIncome();
  var pct = Math.min(100, Math.round((inc.mrr / 2500) * 100));
  var items = '';
  state.income_entries.forEach(function(e) { items += renderIncomeEntry(e); });
  var summary = '<div class="income-summary">' +
    '<div class="income-summary-row"><span class="income-summary-label">Retainer MRR</span><span class="income-summary-val income-mrr-val">$' + Math.round(inc.mrr).toLocaleString() + '</span></div>' +
    '<div class="income-summary-row"><span class="income-summary-label">Total Earned</span><span class="income-summary-val income-total-val">$' + Math.round(inc.total).toLocaleString() + '</span></div>' +
    '<div class="income-target-bar"><div class="income-target-fill" style="width:' + pct + '%"></div></div>' +
    '<div class="income-target-label">' + pct + '% toward $2,500 MRR goal</div>' +
    '</div>';
  el.innerHTML = '<div class="section-header">' +
    '<span class="section-title">Income Tracker</span>' +
    '<button class="btn btn-primary btn-sm" onclick="toggleAddIncome()">+ Log</button>' +
    '</div>' + addFormHtml +
    (items || '<div style="color:var(--muted);font-size:12px;padding:8px 0;">No entries yet.</div>') +
    summary;
}

// ── Render: Tools panel ────────────────────────────────────────────────────
function renderTools() {
  var el = document.getElementById('tools-panel');
  if (!el) return;
  var tools = [
    {name:'Make.com',    status:'Active',   cls:'tool-active'},
    {name:'Claude AI',   status:'Active',   cls:'tool-active'},
    {name:'Notion',      status:'Active',   cls:'tool-active'},
    {name:'Typeform',    status:'Active',   cls:'tool-active'},
    {name:'QuickBooks',  status:'Pending',  cls:'tool-pending'},
    {name:'n8n',         status:'Learning', cls:'tool-learning'}
  ];
  var cards = '';
  tools.forEach(function(t) {
    cards += '<div class="tool-card"><div class="tool-name">' + t.name + '</div>' +
      '<div class="tool-status ' + t.cls + '">\u25cf ' + t.status + '</div></div>';
  });
  el.innerHTML = '<div class="section-title" style="margin-bottom:12px">Tool Stack</div>' +
    '<div class="tools-grid">' + cards + '</div>';
}

// ── Render: OS Panel dispatcher ────────────────────────────────────────────
function renderOS() {
  var tabs = ['workspace', 'clients', 'sops', 'notes'];
  tabs.forEach(function(t) {
    var btn = document.getElementById('ptab-' + t);
    if (btn) btn.className = 'panel-tab' + (t === osTab ? ' active' : '');
  });
  var body = document.getElementById('panel-body');
  if (!body) return;
  if (osTab === 'workspace')   body.innerHTML = buildWorkspaceTab();
  else if (osTab === 'clients') body.innerHTML = buildClientsTab();
  else if (osTab === 'sops')    body.innerHTML = buildSOPsTab();
  else if (osTab === 'notes')   body.innerHTML = buildNotesTab();
}

// ── OS Tab: Workspace ──────────────────────────────────────────────────────
function osStatCard(label, val) {
  return '<div class="os-stat-card"><div class="os-stat-label">' + label + '</div><div class="os-stat-val">' + val + '</div></div>';
}

function buildWorkspaceTab() {
  var inc = calcIncome();
  var activeClients = state.os_data.clients.filter(function(c) { return c.status === 'active'; }).length;
  var stats = '<div class="os-stat-grid">' +
    osStatCard('Active Clients', activeClients) +
    osStatCard('MRR', '$' + Math.round(inc.mrr)) +
    osStatCard('SOPs', state.os_data.sops.length) +
    osStatCard('Notes', state.os_data.notes.length) +
    '</div>';

  var clientRows = '';
  state.os_data.clients.filter(function(c) { return c.status !== 'completed'; }).forEach(function(c) {
    clientRows += '<div class="ws-client-row">' +
      '<span class="ws-client-name">' + escHtml(c.name) + '</span>' +
      '<span class="badge tag-' + (c.status === 'active' ? 'build' : 'sales') + '">' + c.status + '</span>' +
      '<span style="font-family:\'DM Mono\',monospace;font-size:10px;color:var(--muted)">' + escHtml(c.phase || '') + '</span>' +
      '</div>';
  });

  var tracker = '<div class="os-section"><div class="os-section-title">Client Tracker</div>' +
    (clientRows || '<div style="color:var(--muted);font-size:12px">No active clients yet.</div>') + '</div>';

  var links = '<div class="os-section"><div class="os-section-title">Quick Links</div>' +
    '<a class="quick-link" href="https://make.com" target="_blank">\u2197 Make.com</a>' +
    '<a class="quick-link" href="https://supabase.com/dashboard" target="_blank">\u2197 Supabase</a>' +
    '<a class="quick-link" href="https://structtek.com" target="_blank">\u2197 structtek.com</a>' +
    '</div>';

  var sql = '<div class="os-section"><div class="os-section-title">SQL Reminder</div>' +
    '<div class="sql-box">alter table structtech_state<br>add column if not exists<br>os_data jsonb default \'{}\'::jsonb;</div>' +
    '</div>';

  return stats + tracker + links + sql;
}

// ── OS Tab: Clients ────────────────────────────────────────────────────────
function buildClientCard(c) {
  var statusCls = 'status-' + c.status;
  return '<div class="client-card">' +
    '<div class="client-card-header">' +
    '<span class="client-name">' + escHtml(c.name) + '</span>' +
    '<span class="badge ' + statusCls + '">' + c.status + '</span>' +
    '</div>' +
    '<div class="client-meta">' +
    '<span class="client-detail">\ud83d\udd27 ' + escHtml(c.trade || '') + '</span>' +
    '<span class="client-detail">\ud83d\udccd ' + escHtml(c.location || '') + '</span>' +
    '<span class="client-detail">' + escHtml(c.phase || '') + '</span>' +
    (c.retainer ? '<span class="client-detail" style="color:var(--accent2)">$' + c.retainer + '/mo</span>' : '') +
    '</div>' +
    (c.notes ? '<div style="font-size:11px;color:var(--muted);margin-bottom:8px;line-height:1.5">' + escHtml(c.notes) + '</div>' : '') +
    '<div class="client-actions">' +
    '<button class="btn btn-ghost btn-xs" onclick="startEditClient(' + c.id + ')">Edit</button>' +
    '<button class="btn btn-danger btn-xs" onclick="deleteClient(' + c.id + ')">Delete</button>' +
    '</div></div>';
}

function buildClientForm(c) {
  var isNew = !c;
  var v = c || { name: '', trade: '', location: '', status: 'prospect', phase: 'Phase I', auditFee: '', retainer: '', notes: '' };
  var idStr = isNew ? 'new' : c.id;
  var statusOpts = '';
  ['prospect', 'active', 'completed'].forEach(function(s) {
    statusOpts += '<option value="' + s + '"' + (v.status === s ? ' selected' : '') + '>' + s + '</option>';
  });
  var phaseOpts = '';
  ['Phase I', 'Phase II', 'Phase III'].forEach(function(p) {
    phaseOpts += '<option value="' + p + '"' + (v.phase === p ? ' selected' : '') + '>' + p + '</option>';
  });
  return '<div class="inline-form" style="margin-bottom:12px">' +
    '<div class="inline-form-row">' +
    '<input class="form-input" id="cf-name-' + idStr + '" placeholder="Client name" value="' + escAttr(v.name) + '">' +
    '<input class="form-input" id="cf-trade-' + idStr + '" placeholder="Trade" value="' + escAttr(v.trade) + '">' +
    '</div>' +
    '<input class="form-input" id="cf-location-' + idStr + '" placeholder="Location" value="' + escAttr(v.location || '') + '">' +
    '<div class="inline-form-row">' +
    '<select class="form-select" id="cf-status-' + idStr + '">' + statusOpts + '</select>' +
    '<select class="form-select" id="cf-phase-' + idStr + '">' + phaseOpts + '</select>' +
    '</div>' +
    '<div class="inline-form-row">' +
    '<input class="form-input" id="cf-audit-' + idStr + '" type="number" placeholder="Audit fee $" value="' + escAttr(v.auditFee || '') + '">' +
    '<input class="form-input" id="cf-retainer-' + idStr + '" type="number" placeholder="Retainer $/mo" value="' + escAttr(v.retainer || '') + '">' +
    '</div>' +
    '<textarea class="form-textarea" id="cf-notes-' + idStr + '" placeholder="Notes...">' + escHtml(v.notes || '') + '</textarea>' +
    '<div class="inline-form-row">' +
    '<button class="btn btn-primary btn-sm" onclick="saveClient(\'' + idStr + '\')">Save</button>' +
    '<button class="btn btn-ghost btn-sm" onclick="cancelClientForm()">Cancel</button>' +
    '</div></div>';
}

function buildClientsTab() {
  var addFormHtml = '';
  if (showAddClient || editingClientId === 'new') {
    addFormHtml = buildClientForm(null);
  }
  var cards = '';
  state.os_data.clients.forEach(function(c) {
    if (editingClientId === c.id) cards += buildClientForm(c);
    else cards += buildClientCard(c);
  });
  return '<div class="section-header" style="margin-bottom:14px">' +
    '<span class="section-title">Clients</span>' +
    '<button class="btn btn-primary btn-sm" onclick="toggleAddClient()">+ Add Client</button>' +
    '</div>' + addFormHtml + (cards || '<div style="color:var(--muted);font-size:12px">No clients yet.</div>');
}

// ── OS Tab: SOPs ───────────────────────────────────────────────────────────
function buildSOPCard(s) {
  var statusOpts = '';
  ['active', 'draft', 'archived'].forEach(function(st) {
    statusOpts += '<option value="' + st + '"' + (s.status === st ? ' selected' : '') + '>' + st + '</option>';
  });
  var statusClsMap = { active: 'tag-build', draft: 'tag-learn', archived: 'tag-content' };
  var statusCls = statusClsMap[s.status] || 'tag-admin';
  return '<div class="sop-card">' +
    '<div class="sop-card-header">' +
    '<input class="sop-title-input" value="' + escAttr(s.title) + '" onchange="updateSOP(' + s.id + ',\'title\',this.value)" onblur="updateSOP(' + s.id + ',\'title\',this.value)">' +
    '<span class="badge ' + statusCls + '">' + s.status + '</span>' +
    '<select class="sop-status-select" onchange="updateSOP(' + s.id + ',\'status\',this.value)">' + statusOpts + '</select>' +
    '<button class="btn btn-danger btn-xs" onclick="deleteSOP(' + s.id + ')">\u00d7</button>' +
    '</div>' +
    '<textarea class="sop-body-textarea" onblur="updateSOP(' + s.id + ',\'body\',this.value)">' + escHtml(s.body || '') + '</textarea>' +
    '</div>';
}

function buildSOPsTab() {
  var cards = '';
  state.os_data.sops.forEach(function(s) { cards += buildSOPCard(s); });
  return '<div class="section-header" style="margin-bottom:14px">' +
    '<span class="section-title">SOPs</span>' +
    '<button class="btn btn-primary btn-sm" onclick="addSOP()">+ New</button>' +
    '</div>' + cards;
}

// ── OS Tab: Notes ──────────────────────────────────────────────────────────
function buildNoteCard(n) {
  var pinCls = 'pin-btn ' + (n.pinned ? 'pinned' : 'unpinned');
  var cardCls = 'note-card' + (n.pinned ? ' pinned' : '');
  return '<div class="' + cardCls + '">' +
    '<div class="note-card-header">' +
    '<input class="note-title-input" value="' + escAttr(n.title) + '" onblur="updateNote(' + n.id + ',\'title\',this.value)">' +
    '<button class="' + pinCls + '" onclick="togglePinNote(' + n.id + ')" title="' + (n.pinned ? 'Unpin' : 'Pin') + '">\ud83d\udccc</button>' +
    '<button class="btn btn-danger btn-xs" onclick="deleteNote(' + n.id + ')">\u00d7</button>' +
    '</div>' +
    '<textarea class="note-body-textarea" onblur="updateNote(' + n.id + ',\'body\',this.value)">' + escHtml(n.body || '') + '</textarea>' +
    '</div>';
}

function buildNotesTab() {
  var pinned = state.os_data.notes.filter(function(n) { return n.pinned; });
  var unpinned = state.os_data.notes.filter(function(n) { return !n.pinned; });
  var cards = '';
  pinned.concat(unpinned).forEach(function(n) { cards += buildNoteCard(n); });
  return '<div class="section-header" style="margin-bottom:14px">' +
    '<span class="section-title">Notes</span>' +
    '<button class="btn btn-primary btn-sm" onclick="addNote()">+ New</button>' +
    '</div>' + (cards || '<div style="color:var(--muted);font-size:12px">No notes yet.</div>');
}

// ── Render all ─────────────────────────────────────────────────────────────
function renderAll() {
  renderHeader();
  renderStats();
  renderTaskBoard();
  renderMilestones();
  renderProspects();
  renderIncome();
  renderTools();
  if (osOpen) renderOS();
}

// ── Event handlers: Tasks ──────────────────────────────────────────────────
function toggleTask(id) {
  state.task_state[id] = !state.task_state[id];
  scheduleSave();
  renderTaskBoard();
  renderStats();
  renderWeekNavOnly();
}

function renderWeekNavOnly() {
  var nav = document.querySelector('.week-nav');
  if (!nav) return;
  var html = '';
  for (var i = 1; i <= 16; i++) html += renderWeekBtn(i);
  nav.innerHTML = html;
}

function startEditTask(id) {
  editingTask = id;
  renderTaskBoard();
}

function handleEditKey(e, id) {
  if (e.key === 'Enter') saveEditTask(id);
  if (e.key === 'Escape') cancelEditTask();
}

function saveEditTask(id) {
  var inp = document.getElementById('edit-input-' + id);
  var tagEl = document.getElementById('edit-tag-' + id);
  var text = inp ? inp.value.trim() : '';
  var tag = tagEl ? tagEl.value : 'admin';
  if (!text) { cancelEditTask(); return; }
  var isCustom = false;
  for (var w = 1; w <= 16; w++) {
    var ct = state.task_state['custom_w' + w] || [];
    var idx = -1;
    for (var i = 0; i < ct.length; i++) { if (ct[i].id === id) { idx = i; break; } }
    if (idx >= 0) { ct[idx].text = text; ct[idx].tag = tag; state.task_state['custom_w' + w] = ct; isCustom = true; break; }
  }
  if (!isCustom) {
    state.task_state['override_' + id] = { text: text, tag: tag };
  }
  editingTask = null;
  scheduleSave();
  renderTaskBoard();
}

function cancelEditTask() {
  editingTask = null;
  renderTaskBoard();
}

function deleteTask(id) {
  var isCustom = false;
  for (var w = 1; w <= 16; w++) {
    var ct = state.task_state['custom_w' + w] || [];
    var filtered = ct.filter(function(t) { return t.id !== id; });
    if (filtered.length !== ct.length) { state.task_state['custom_w' + w] = filtered; isCustom = true; break; }
  }
  if (!isCustom) {
    state.task_state['deleted_' + id] = true;
    delete state.task_state['override_' + id];
    delete state.task_state[id];
  }
  editingTask = null;
  scheduleSave();
  renderTaskBoard();
  renderStats();
}

function addTask() {
  var inp = document.getElementById('new-task-input');
  var tagEl = document.getElementById('new-task-tag');
  var text = inp ? inp.value.trim() : '';
  if (!text) return;
  var tag = tagEl ? tagEl.value : 'admin';
  var newTask = { id: 'ct_' + genId(), text: text, tag: tag };
  var key = 'custom_w' + viewWeek;
  if (!state.task_state[key]) state.task_state[key] = [];
  state.task_state[key].push(newTask);
  scheduleSave();
  renderTaskBoard();
  renderStats();
}

function setWeek(n) {
  viewWeek = n;
  state.current_week = n;
  editingTask = null;
  scheduleSave();
  renderHeader();
  renderStats();
  renderTaskBoard();
  renderMilestones();
}

// ── Event handlers: Prospects ──────────────────────────────────────────────
function toggleAddProspect() {
  showAddProspect = !showAddProspect;
  renderProspects();
  if (showAddProspect) {
    setTimeout(function() { var el = document.getElementById('np-name'); if (el) el.focus(); }, 50);
  }
}

function cancelAddProspect() { showAddProspect = false; renderProspects(); }

function saveProspect() {
  var name  = (document.getElementById('np-name')  || {}).value || '';
  var type  = (document.getElementById('np-trade') || {}).value || '';
  var stage = (document.getElementById('np-stage') || {}).value || 'Cold';
  if (!name.trim()) return;
  state.prospects.push({ name: name.trim(), type: type.trim(), stage: stage });
  showAddProspect = false;
  scheduleSave();
  renderProspects();
  renderStats();
}

function cycleStage(idx) {
  var stages = ['Cold', 'Warm', 'Hot', 'Won'];
  var p = state.prospects[idx];
  if (!p) return;
  var i = stages.indexOf(p.stage);
  p.stage = stages[(i + 1) % stages.length];
  scheduleSave();
  renderProspects();
}

function deleteProspect(idx) {
  state.prospects.splice(idx, 1);
  scheduleSave();
  renderProspects();
  renderStats();
}

// ── Event handlers: Income ─────────────────────────────────────────────────
function toggleAddIncome() {
  showAddIncome = !showAddIncome;
  renderIncome();
  if (showAddIncome) {
    setTimeout(function() { var el = document.getElementById('ni-label'); if (el) el.focus(); }, 50);
  }
}

function cancelAddIncome() { showAddIncome = false; renderIncome(); }

function saveIncome() {
  var type  = (document.getElementById('ni-type')   || {}).value || 'Other';
  var label = (document.getElementById('ni-label')  || {}).value || '';
  var amt   = parseFloat((document.getElementById('ni-amount') || {}).value) || 0;
  if (!label.trim() || amt <= 0) return;
  state.income_entries.push({ id: genId(), label: label.trim(), amount: amt, type: type, date: new Date().toISOString() });
  showAddIncome = false;
  scheduleSave();
  renderIncome();
  renderStats();
}

function deleteIncome(id) {
  state.income_entries = state.income_entries.filter(function(e) { return e.id !== id; });
  scheduleSave();
  renderIncome();
  renderStats();
}

// ── Event handlers: OS Panel ───────────────────────────────────────────────
function openOS() {
  osOpen = true;
  document.getElementById('os-panel').classList.add('open');
  document.getElementById('os-overlay').classList.add('open');
  renderOS();
}

function closeOS() {
  osOpen = false;
  document.getElementById('os-panel').classList.remove('open');
  document.getElementById('os-overlay').classList.remove('open');
}

function switchOSTab(tab) {
  osTab = tab;
  showAddClient = false;
  editingClientId = null;
  renderOS();
}

// ── Event handlers: Clients ────────────────────────────────────────────────
function toggleAddClient() {
  showAddClient = !showAddClient;
  editingClientId = showAddClient ? 'new' : null;
  renderOS();
  if (showAddClient) {
    setTimeout(function() { var el = document.getElementById('cf-name-new'); if (el) el.focus(); }, 50);
  }
}

function cancelClientForm() {
  showAddClient = false;
  editingClientId = null;
  renderOS();
}

function saveClient(idStr) {
  var name     = (document.getElementById('cf-name-'     + idStr) || {}).value || '';
  var trade    = (document.getElementById('cf-trade-'    + idStr) || {}).value || '';
  var location = (document.getElementById('cf-location-' + idStr) || {}).value || '';
  var status   = (document.getElementById('cf-status-'   + idStr) || {}).value || 'prospect';
  var phase    = (document.getElementById('cf-phase-'    + idStr) || {}).value || 'Phase I';
  var auditFee = (document.getElementById('cf-audit-'    + idStr) || {}).value || '';
  var retainer = (document.getElementById('cf-retainer-' + idStr) || {}).value || '';
  var notes    = (document.getElementById('cf-notes-'    + idStr) || {}).value || '';
  if (!name.trim()) return;
  if (idStr === 'new') {
    state.os_data.clients.push({ id: genId(), name: name.trim(), trade: trade.trim(), location: location.trim(), status: status, phase: phase, auditFee: auditFee, retainer: retainer, notes: notes.trim() });
  } else {
    var numId = parseInt(idStr);
    var c = state.os_data.clients.find(function(x) { return x.id === numId; });
    if (c) { c.name = name.trim(); c.trade = trade.trim(); c.location = location.trim(); c.status = status; c.phase = phase; c.auditFee = auditFee; c.retainer = retainer; c.notes = notes.trim(); }
  }
  showAddClient = false;
  editingClientId = null;
  scheduleSave();
  renderOS();
  renderStats();
}

function startEditClient(id) {
  editingClientId = id;
  showAddClient = false;
  renderOS();
  setTimeout(function() { var el = document.getElementById('cf-name-' + id); if (el) el.focus(); }, 50);
}

function deleteClient(id) {
  state.os_data.clients = state.os_data.clients.filter(function(c) { return c.id !== id; });
  scheduleSave();
  renderOS();
  renderStats();
}

// ── Event handlers: SOPs ───────────────────────────────────────────────────
function addSOP() {
  state.os_data.sops.push({ id: genId(), title: 'New SOP', status: 'draft', body: '' });
  scheduleSave();
  renderOS();
}

function deleteSOP(id) {
  state.os_data.sops = state.os_data.sops.filter(function(s) { return s.id !== id; });
  scheduleSave();
  renderOS();
}

function updateSOP(id, field, value) {
  var s = state.os_data.sops.find(function(x) { return x.id === id; });
  if (s) { s[field] = value; scheduleSave(); if (field === 'status') renderOS(); }
}

// ── Event handlers: Notes ──────────────────────────────────────────────────
function addNote() {
  state.os_data.notes.push({ id: genId(), title: 'New Note', pinned: false, body: '' });
  scheduleSave();
  renderOS();
}

function deleteNote(id) {
  state.os_data.notes = state.os_data.notes.filter(function(n) { return n.id !== id; });
  scheduleSave();
  renderOS();
}

function updateNote(id, field, value) {
  var n = state.os_data.notes.find(function(x) { return x.id === id; });
  if (n) { n[field] = value; scheduleSave(); }
}

function togglePinNote(id) {
  var n = state.os_data.notes.find(function(x) { return x.id === id; });
  if (n) { n.pinned = !n.pinned; scheduleSave(); renderOS(); }
}

// ── Init ───────────────────────────────────────────────────────────────────
async function init() {
  await loadState();
  if (!state.os_data.sops  || state.os_data.sops.length  === 0) state.os_data.sops  = JSON.parse(JSON.stringify(DEFAULT_SOPS));
  if (!state.os_data.notes || state.os_data.notes.length === 0) state.os_data.notes = JSON.parse(JSON.stringify(DEFAULT_NOTES));
  viewWeek = state.current_week;
  renderNav('dashboard');
  renderAll();
}

document.addEventListener('DOMContentLoaded', init);
</script>
