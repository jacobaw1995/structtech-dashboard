<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>StructTech — Automations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
.au-view { display: none; }
.au-view.active { display: block; }

/* ══ COMMAND ══════════════════════════════════════════════════════════════ */
.cmd-wrap { padding: 24px; }

/* Command metrics banner */
.cmd-metrics {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 12px; margin-bottom: 28px;
}
.cmd-metric {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 16px 18px; position: relative; overflow: hidden;
}
.cmd-metric::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: var(--accent);
}
.cmd-metric.blue::before  { background: var(--blue); }
.cmd-metric.green::before { background: var(--accent2); }
.cmd-metric.warn::before  { background: var(--warn); }
.cmd-metric.purple::before { background: #c084fc; }
.cmd-metric-val { font-size: 28px; font-weight: 700; line-height: 1; margin-bottom: 4px; }
.cmd-metric-val.accent { color: var(--accent); }
.cmd-metric-val.green  { color: var(--accent2); }
.cmd-metric-val.blue   { color: var(--blue); }
.cmd-metric-val.purple { color: #c084fc; }
.cmd-metric-label { font-family: 'DM Mono', monospace; font-size: 9px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }

/* Client rows */
.cmd-clients-header {
  display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px;
}
.cmd-clients-title { font-family: 'DM Mono', monospace; font-size: 10px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }

.cmd-client-row {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; margin-bottom: 8px; overflow: hidden; cursor: pointer;
  transition: border-color .15s;
}
.cmd-client-row:hover { border-color: var(--border2); }
.cmd-client-row.expanded { border-color: var(--accent); }

.cmd-client-summary {
  display: flex; align-items: center; gap: 16px; padding: 14px 18px;
}
.cmd-client-name { font-size: 14px; font-weight: 600; flex: 1; }
.cmd-client-meta { font-size: 11px; color: var(--muted); }
.cmd-stack-dots { display: flex; gap: 4px; align-items: center; }
.cmd-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--border2); flex-shrink: 0; transition: background .15s;
}
.cmd-dot.live      { background: var(--accent2); }
.cmd-dot.inprogress{ background: var(--warn); }
.cmd-dot.planned   { background: #64748b; }
.cmd-dot.paused    { background: var(--danger); }

.cmd-health-bar-wrap {
  width: 80px; height: 6px; background: var(--surface2); border-radius: 3px; overflow: hidden;
}
.cmd-health-bar { height: 100%; border-radius: 3px; background: var(--accent2); transition: width .3s; }

.cmd-client-vals { display: flex; gap: 20px; flex-shrink: 0; }
.cmd-client-val { text-align: right; }
.cmd-client-val-num { font-family: 'DM Mono', monospace; font-size: 13px; }
.cmd-client-val-num.accent { color: var(--accent); }
.cmd-client-val-num.green  { color: var(--accent2); }
.cmd-client-val-label { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-family: 'DM Mono', monospace; }

.cmd-client-detail {
  display: none; padding: 0 18px 16px 18px;
  border-top: 1px solid var(--border);
}
.cmd-client-row.expanded .cmd-client-detail { display: block; }
.cmd-module-grid { display: flex; flex-direction: column; gap: 6px; padding-top: 12px; }
.cmd-module-row {
  display: flex; align-items: center; gap: 12px; padding: 10px 12px;
  background: var(--surface2); border-radius: 7px; border: 1px solid var(--border);
}
.cmd-module-icon { font-size: 16px; flex-shrink: 0; }
.cmd-module-name { font-size: 12px; font-weight: 500; flex: 1; }
.cmd-module-hours { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--accent2); }
.cmd-module-status-sel {
  font-family: 'DM Mono', monospace; font-size: 9px; text-transform: uppercase;
  letter-spacing: .06em; padding: 3px 6px; border-radius: 3px;
  border: 1px solid var(--border); background: var(--surface); color: var(--text);
  cursor: pointer;
}
.cmd-module-remove {
  background: none; border: none; color: var(--muted); cursor: pointer;
  font-size: 16px; line-height: 1; padding: 0 2px; transition: color .12s;
}
.cmd-module-remove:hover { color: var(--danger); }

.cmd-add-btn {
  margin-top: 8px; width: 100%; padding: 8px;
  border: 1px dashed var(--border); border-radius: 6px;
  background: transparent; color: var(--muted); font-size: 11px;
  cursor: pointer; transition: all .15s;
}
.cmd-add-btn:hover { border-color: var(--accent); color: var(--accent); }

.cmd-empty {
  padding: 48px 24px; text-align: center; color: var(--muted);
}
.cmd-empty h3 { font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 6px; }

/* ══ BUILD ════════════════════════════════════════════════════════════════ */
.build-wrap {
  display: grid; grid-template-columns: 1fr 360px; gap: 0;
  height: calc(100vh - 130px);
}
.build-canvas { padding: 24px; overflow-y: auto; }
.build-sidebar {
  border-left: 1px solid var(--border); padding: 20px;
  overflow-y: auto; background: var(--surface);
}
.build-title-row { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
.build-spec-name {
  flex: 1; font-size: 16px; font-weight: 600;
  background: transparent; border: none; border-bottom: 1px solid var(--border);
  color: var(--text); padding: 4px 0; outline: none;
}
.build-spec-name::placeholder { color: var(--muted); font-weight: 400; }
.build-spec-name:focus { border-bottom-color: var(--accent); }

/* Flow nodes */
.flow-node {
  position: relative; margin-bottom: 0;
}
.flow-connector {
  width: 2px; height: 28px; background: var(--border2);
  margin: 0 auto; position: relative;
}
.flow-connector::after {
  content: '▼'; position: absolute; bottom: -8px; left: 50%;
  transform: translateX(-50%); font-size: 8px; color: var(--border2);
}

.flow-card {
  border: 1px solid var(--border); border-radius: 10px;
  overflow: hidden; transition: border-color .15s;
}
.flow-card:hover { border-color: var(--border2); }
.flow-card.trigger-node { border-color: var(--accent); }
.flow-card.condition-node { border-color: var(--warn); }

.flow-card-header {
  display: flex; align-items: center; gap: 10px; padding: 10px 14px;
  border-bottom: 1px solid var(--border);
}
.flow-card-type-badge {
  font-family: 'DM Mono', monospace; font-size: 8px; text-transform: uppercase;
  letter-spacing: .06em; padding: 2px 7px; border-radius: 3px;
}
.type-trigger   { background: rgba(200,240,96,.15); color: var(--accent); }
.type-action    { background: rgba(96,165,250,.15);  color: var(--blue); }
.type-condition { background: rgba(245,158,11,.15);  color: var(--warn); }
.type-end       { background: rgba(74,222,128,.15);  color: var(--accent2); }

.flow-card-label { font-size: 13px; font-weight: 500; flex: 1; }
.flow-card-tool {
  font-family: 'DM Mono', monospace; font-size: 9px; padding: 2px 6px;
  border-radius: 3px; background: var(--surface2); border: 1px solid var(--border);
  color: var(--muted);
}
.flow-card-body { padding: 10px 14px; }
.flow-card-notes {
  font-size: 11px; color: var(--muted); line-height: 1.5;
  min-height: 28px;
}
.flow-card-remove {
  background: none; border: none; color: var(--border2); cursor: pointer;
  font-size: 16px; line-height: 1; transition: color .12s; padding: 0;
}
.flow-card-remove:hover { color: var(--danger); }

.add-step-row { display: flex; gap: 6px; margin-top: 4px; }
.add-step-btn {
  flex: 1; padding: 8px 12px; border-radius: 6px; font-size: 11px;
  border: 1px dashed var(--border); background: transparent; color: var(--muted);
  cursor: pointer; transition: all .15s; font-family: 'DM Mono', monospace;
  text-transform: uppercase; letter-spacing: .06em;
}
.add-step-btn:hover { border-color: var(--accent); color: var(--accent); }
.add-step-btn.action    { }
.add-step-btn.condition { }

/* Build sidebar */
.build-sidebar-section { margin-bottom: 20px; }
.build-sidebar-title {
  font-family: 'DM Mono', monospace; font-size: 9px; text-transform: uppercase;
  letter-spacing: .07em; color: var(--muted); margin-bottom: 10px;
}
.build-saved-specs { display: flex; flex-direction: column; gap: 6px; }
.build-spec-item {
  padding: 10px 12px; border: 1px solid var(--border); border-radius: 7px;
  background: var(--surface2); cursor: pointer; transition: border-color .12s;
}
.build-spec-item:hover { border-color: var(--border2); }
.build-spec-item.active { border-color: var(--accent); }
.build-spec-item-name { font-size: 12px; font-weight: 500; margin-bottom: 2px; }
.build-spec-item-meta { font-size: 10px; color: var(--muted); }

.build-actions { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
.build-client-select { width: 100%; }

/* Step edit modal */
.step-edit-modal-backdrop {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,.65); z-index: 200;
  align-items: center; justify-content: center;
}
.step-edit-modal-backdrop.open { display: flex; }
.step-edit-modal {
  background: var(--surface); border: 1px solid var(--border2);
  border-radius: 12px; padding: 22px; width: 440px; max-width: 95vw;
}
.step-edit-title { font-size: 14px; font-weight: 600; margin-bottom: 14px; }
.step-edit-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
.step-edit-footer { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }

/* ══ LIBRARY ══════════════════════════════════════════════════════════════ */
.lib-wrap { padding: 24px; }
.lib-filter-row { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
.lib-filter-btn {
  font-family: 'DM Mono', monospace; font-size: 9px; text-transform: uppercase;
  letter-spacing: .07em; padding: 5px 12px; border-radius: 4px;
  border: 1px solid var(--border); background: var(--surface2); color: var(--muted);
  cursor: pointer; transition: all .12s;
}
.lib-filter-btn:hover { color: var(--text); }
.lib-filter-btn.active { background: var(--accent); color: #0d1117; border-color: var(--accent); }

.lib-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
  gap: 14px;
}
.lib-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 18px; display: flex; flex-direction: column;
  transition: border-color .15s;
}
.lib-card:hover { border-color: var(--border2); }
.lib-card-header { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 10px; }
.lib-card-icon {
  width: 38px; height: 38px; border-radius: 8px;
  background: var(--surface2); display: flex; align-items: center;
  justify-content: center; font-size: 18px; flex-shrink: 0;
}
.lib-card-title { font-size: 14px; font-weight: 600; margin-bottom: 3px; }
.lib-card-area {
  font-family: 'DM Mono', monospace; font-size: 9px; text-transform: uppercase;
  letter-spacing: .07em; color: var(--muted);
}
.lib-card-desc { font-size: 12px; color: var(--muted); line-height: 1.5; margin-bottom: 14px; flex: 1; }

.lib-roi-bar {
  background: var(--surface2); border-radius: 6px; padding: 10px 12px;
  margin-bottom: 12px; display: flex; gap: 16px;
}
.lib-roi-item { flex: 1; }
.lib-roi-val { font-family: 'DM Mono', monospace; font-size: 16px; font-weight: 600; }
.lib-roi-val.accent { color: var(--accent); }
.lib-roi-val.green  { color: var(--accent2); }
.lib-roi-val.blue   { color: var(--blue); }
.lib-roi-label { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-family: 'DM Mono', monospace; margin-top: 1px; }

.lib-tools { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 12px; }
.lib-tool-tag {
  font-family: 'DM Mono', monospace; font-size: 9px; padding: 2px 7px;
  border-radius: 3px; background: var(--surface2); color: var(--muted);
  border: 1px solid var(--border);
}
.lib-clients-using {
  font-family: 'DM Mono', monospace; font-size: 10px; color: var(--muted); margin-bottom: 10px;
}
.lib-clients-using span { color: var(--accent2); }
.lib-card-footer { display: flex; gap: 8px; }
.lib-steps { font-size: 11px; color: var(--muted); line-height: 1.6; margin-bottom: 12px; }
.lib-step-item { padding: 2px 0; }

/* ══ ADD MODULE MODAL ════════════════════════════════════════════════════ */
.au-add-modal-backdrop {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,.65); z-index: 300;
  align-items: center; justify-content: center;
}
.au-add-modal-backdrop.open { display: flex; }
.au-add-modal {
  background: var(--surface); border: 1px solid var(--border2);
  border-radius: 12px; padding: 22px; width: 500px; max-width: 95vw;
  max-height: 85vh; overflow-y: auto;
}
.au-add-row {
  display: flex; align-items: center; gap: 12px; padding: 10px 12px;
  border: 1px solid var(--border); border-radius: 7px; cursor: pointer;
  transition: border-color .12s; background: var(--surface2); margin-bottom: 6px;
}
.au-add-row:hover { border-color: var(--border2); }
.au-add-row.selected { border-color: var(--accent); background: rgba(200,240,96,.06); }
.au-add-row-name { font-size: 13px; font-weight: 500; flex: 1; }
.au-add-row-price { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--accent); }
.au-modal-footer { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
</style>
</head>
<body>

<header>
  <div class="header-logo">
    <span class="logo-main">STRUCTTECH</span>
    <span class="logo-div">/</span>
    <span class="logo-ops">OPS</span>
  </div>
  <div id="sync-status" class="sync-status sync-loading">● Loading</div>
  <div id="header-date" class="header-date"></div>
  <div id="week-badge" class="week-badge">W1</div>
</header>

<div id="app-nav" class="app-nav"></div>

<div class="df-subnav">
  <button class="df-subnav-btn active" id="subnav-command" onclick="showView('command')">⚡ Command</button>
  <button class="df-subnav-btn" id="subnav-build"   onclick="showView('build')">⬡ Build</button>
  <button class="df-subnav-btn" id="subnav-library" onclick="showView('library')">≡ Library</button>
</div>

<!-- ══ COMMAND ══ -->
<div id="view-command" class="au-view active">
  <div class="cmd-wrap">
    <div class="cmd-metrics" id="cmd-metrics"></div>
    <div class="cmd-clients-header">
      <div class="cmd-clients-title" id="cmd-clients-label">Active Clients</div>
      <a href="clients.html" class="btn btn-ghost btn-sm" style="text-decoration:none;font-size:11px">Pipeline →</a>
    </div>
    <div id="cmd-client-rows"></div>
  </div>
</div>

<!-- ══ BUILD ══ -->
<div id="view-build" class="au-view">
  <div class="build-wrap">
    <div class="build-canvas">
      <div class="build-title-row">
        <input class="build-spec-name" id="spec-name" placeholder="Name this automation spec…">
        <select class="form-select" id="spec-client" style="max-width:200px;font-size:12px">
          <option value="">Assign to client…</option>
        </select>
      </div>
      <div id="flow-canvas"></div>
      <div class="add-step-row" id="add-step-row" style="margin-top:16px">
        <button class="add-step-btn action"    onclick="addStep('action')">+ Action</button>
        <button class="add-step-btn condition" onclick="addStep('condition')">+ Condition</button>
        <button class="add-step-btn" style="border-color:var(--accent2);color:var(--accent2)" onclick="addStep('end')">✓ End</button>
      </div>
    </div>
    <div class="build-sidebar">
      <div class="build-sidebar-section">
        <div class="build-sidebar-title">Saved Specs</div>
        <div class="build-saved-specs" id="saved-specs-list"></div>
        <button class="btn btn-ghost btn-sm" style="width:100%;margin-top:8px" onclick="newSpec()">+ New Spec</button>
      </div>
      <div class="build-sidebar-section">
        <div class="build-actions">
          <button class="btn btn-primary btn-sm" onclick="saveSpec()">Save Spec</button>
          <button class="btn btn-sm" style="background:var(--surface2)" onclick="exportSpec()">Export Summary</button>
          <button class="btn btn-danger btn-sm" id="delete-spec-btn" style="display:none" onclick="deleteSpec()">Delete Spec</button>
        </div>
      </div>
      <div class="build-sidebar-section">
        <div class="build-sidebar-title">Quick Triggers</div>
        <div style="display:flex;flex-direction:column;gap:4px" id="trigger-palette"></div>
      </div>
    </div>
  </div>
</div>

<!-- ══ LIBRARY ══ -->
<div id="view-library" class="au-view">
  <div class="lib-wrap">
    <div class="lib-filter-row" id="lib-filters"></div>
    <div class="lib-grid" id="lib-grid"></div>
  </div>
</div>

<!-- ══ Add Module Modal ══ -->
<div class="au-add-modal-backdrop" id="add-modal-backdrop" onclick="closeAddModal(event)">
  <div class="au-add-modal">
    <div style="font-size:14px;font-weight:600;margin-bottom:14px" id="add-modal-title">Add Module</div>
    <div id="add-module-grid"></div>
    <textarea class="form-textarea" id="add-module-notes" rows="2" placeholder="Notes (optional)…" style="margin-top:10px"></textarea>
    <div class="au-modal-footer">
      <button class="btn btn-ghost btn-sm" onclick="closeAddModal()">Cancel</button>
      <button class="btn btn-primary btn-sm" onclick="confirmAddModule()">Add</button>
    </div>
  </div>
</div>

<!-- ══ Step Edit Modal ══ -->
<div class="step-edit-modal-backdrop" id="step-modal-backdrop" onclick="closeStepModal(event)">
  <div class="step-edit-modal">
    <div class="step-edit-title" id="step-modal-title">Edit Step</div>
    <input type="hidden" id="step-edit-idx">
    <div class="step-edit-row">
      <div>
        <label class="form-label">Label</label>
        <input type="text" class="form-input" id="step-label" placeholder="e.g. Send confirmation email">
      </div>
      <div>
        <label class="form-label">Tool / Platform</label>
        <input type="text" class="form-input" id="step-tool" placeholder="e.g. Make.com">
      </div>
    </div>
    <div>
      <label class="form-label">Notes / Logic</label>
      <textarea class="form-textarea" id="step-notes" rows="3" placeholder="What does this step do? Any conditions or edge cases?"></textarea>
    </div>
    <div class="step-edit-footer">
      <button class="btn btn-ghost btn-sm" onclick="closeStepModal()">Cancel</button>
      <button class="btn btn-primary btn-sm" onclick="saveStep()">Save</button>
    </div>
  </div>
</div>

<script src="shared.js"></script>
<script src="nav.js"></script>

  { id:'leads',         name:'Lead & CRM Follow-Up',          area:'Sales',      icon:'🎯', desc:'New leads auto-enter your pipeline, get an instant response, and receive a follow-up sequence until they book or go cold.', price:500, hoursPerWeek:4, tools:['Make.com','Airtable','SMS/Email'], steps:['New lead form/inquiry captured + logged','Instant auto-reply sent within 2 minutes','Follow-up sequence over 7 days','Unresponsive leads tagged cold, owner notified'] },
  { id:'training',      name:'Team Training & Handoff',       area:'HR',         icon:'🎓', desc:'Onboarding checklist automation, role-based training task assignment, and progress tracking for new hires and promoted techs.', price:350, hoursPerWeek:2, tools:['Make.com','Notion','Email'], steps:['New hire added → onboarding sequence triggered','Training tasks assigned by role in Notion','Manager notified at each milestone','Completion tracked + documented'] },
  { id:'sops',          name:'SOPs & Process Documentation',  area:'Operations', icon:'📋', desc:'Build out standard operating procedures as living documents — accessible in the field, updatable in real time, linked to job types.', price:250, hoursPerWeek:1, tools:['Notion','Make.com'], steps:['SOP templates built per job type','Technicians access via mobile-friendly link','Update triggers notify affected team','Version history maintained automatically'] }
];

var BP_MAP = {};
BLUEPRINTS.forEach(function(b) { BP_MAP[b.id] = b; });

// ══ State ══════════════════════════════════════════════════════════════════
var currentView = 'command';
var expandedClient = null;
var addModalClientId = null;
var selectedBpIds = [];
var currentSpecId = null;
var flowSteps = [];
var editingStepIdx = null;
var libFilter = 'All';

// ══ View ═══════════════════════════════════════════════════════════════════
function showView(v) {
  currentView = v;
  document.querySelectorAll('.au-view').forEach(function(el) { el.classList.remove('active'); });
  document.querySelectorAll('.df-subnav-btn').forEach(function(el) { el.classList.remove('active'); });
  document.getElementById('view-' + v).classList.add('active');
  document.getElementById('subnav-' + v).classList.add('active');
  if (v === 'command') renderCommand();
  if (v === 'build')   initBuild();
  if (v === 'library') renderLibrary();
}

// ══ COMMAND ════════════════════════════════════════════════════════════════
function getClientsWithData() {
  var pp = state.os_data.prospects || [];
  var am = state.os_data.automations || {};
  return pp.map(function(p) {
    return { prospect: p, modules: am[p.id] || [] };
  }).filter(function(c) {
    return c.modules.length > 0 ||
      c.prospect.stage === 'Closed' ||
      c.prospect.stage === 'Proposal Sent' ||
      c.prospect.stage === 'Audit Scheduled';
  });
}

function renderCommand() {
  var clients = getClientsWithData();
  var totalModules = 0, liveModules = 0, totalHours = 0, totalValue = 0;
  clients.forEach(function(c) {
    c.modules.forEach(function(m) {
      totalModules++;
      if (m.status === 'live') { liveModules++; }
      var bp = BP_MAP[m.blueprintId];
      if (bp) { totalHours += bp.hoursPerWeek; totalValue += bp.price; }
    });
  });

  var metricsEl = document.getElementById('cmd-metrics');
  metricsEl.innerHTML =
    metric('Clients Tracked', clients.length, 'blue', 'blue') +
    metric('Modules Live', liveModules + ' / ' + totalModules, 'green', 'green') +
    metric('Hrs Saved / Wk', totalHours, '', 'accent') +
    metric('Value Deployed', '$' + totalValue.toLocaleString(), 'purple', 'purple');

  document.getElementById('cmd-clients-label').textContent =
    'Clients (' + clients.length + ')';

  var rowsEl = document.getElementById('cmd-client-rows');
  if (clients.length === 0) {
    rowsEl.innerHTML = '<div class="cmd-empty"><h3>No clients in the tracker yet</h3><p>Add leads in the Clients pipeline. Prospects in Audit Scheduled, Proposal Sent, or Closed stages appear here.</p></div>';
    return;
  }

  rowsEl.innerHTML = clients.map(function(c) {
    var p = c.prospect;
    var mods = c.modules;
    var live = mods.filter(function(m) { return m.status === 'live'; }).length;
    var pct = mods.length > 0 ? Math.round(live / mods.length * 100) : 0;
    var hrs = mods.reduce(function(s, m) { var bp = BP_MAP[m.blueprintId]; return s + (bp ? bp.hoursPerWeek : 0); }, 0);
    var val = mods.reduce(function(s, m) { var bp = BP_MAP[m.blueprintId]; return s + (bp ? bp.price : 0); }, 0);
    var dots = mods.map(function(m) {
      return '<span class="cmd-dot ' + (m.status || 'planned') + '" title="' + escAttr(BP_MAP[m.blueprintId] ? BP_MAP[m.blueprintId].name : m.blueprintId) + '"></span>';
    }).join('');
    var expanded = expandedClient === p.id;
    var detailHtml = renderClientDetail(p, mods);
    return '<div class="cmd-client-row' + (expanded ? ' expanded' : '') + '" id="ccrow-' + escAttr(p.id) + '">' +
      '<div class="cmd-client-summary" onclick="toggleClient(\'' + escAttr(p.id) + '\')">' +
        '<div style="flex:1;min-width:0">' +
          '<div class="cmd-client-name">' + escHtml(p.company_name || p.name || '') + '</div>' +
          '<div class="cmd-client-meta">' + escHtml(p.trade_type || p.bizType || '') + (p.city ? ' · ' + escHtml(p.city) : '') + ' · ' + escHtml(p.stage || '') + '</div>' +
        '</div>' +
        '<div style="display:flex;flex-direction:column;align-items:center;gap:6px;margin:0 16px">' +
          '<div class="cmd-stack-dots">' + (dots || '<span style="font-size:10px;color:var(--muted)">no modules</span>') + '</div>' +
          (mods.length > 0 ? '<div class="cmd-health-bar-wrap"><div class="cmd-health-bar" style="width:' + pct + '%"></div></div>' : '') +
        '</div>' +
        '<div class="cmd-client-vals">' +
          '<div class="cmd-client-val"><div class="cmd-client-val-num accent">' + hrs + '</div><div class="cmd-client-val-label">hrs/wk</div></div>' +
          '<div class="cmd-client-val"><div class="cmd-client-val-num green">$' + val.toLocaleString() + '</div><div class="cmd-client-val-label">value</div></div>' +
          '<div class="cmd-client-val" style="font-size:18px;color:var(--muted)">' + (expanded ? '▲' : '▼') + '</div>' +
        '</div>' +
      '</div>' +
      '<div class="cmd-client-detail">' + detailHtml + '</div>' +
    '</div>';
  }).join('');
}

function metric(label, val, topColor, valColor) {
  return '<div class="cmd-metric ' + topColor + '">' +
    '<div class="cmd-metric-val ' + valColor + '">' + val + '</div>' +
    '<div class="cmd-metric-label">' + label + '</div>' +
  '</div>';
}

function renderClientDetail(p, mods) {
  var rows = '';
  if (mods.length > 0) {
    rows = mods.map(function(m, idx) {
      var bp = BP_MAP[m.blueprintId] || {};
      var statusOpts = ['planned','inprogress','live','paused'];
      var sel = '<select class="cmd-module-status-sel" onclick="event.stopPropagation()" onchange="setModStatus(\'' + escAttr(p.id) + '\',' + idx + ',this.value)">' +
        statusOpts.map(function(s) {
          return '<option value="' + s + '"' + (m.status === s ? ' selected' : '') + '>' + s.charAt(0).toUpperCase() + s.slice(1) + '</option>';
        }).join('') + '</select>';
      return '<div class="cmd-module-row">' +
        '<span class="cmd-module-icon">' + (bp.icon || '⚙️') + '</span>' +
        '<span class="cmd-module-name">' + escHtml(bp.name || m.blueprintId) + '</span>' +
        (bp.hoursPerWeek ? '<span class="cmd-module-hours">' + bp.hoursPerWeek + ' hrs/wk</span>' : '') +
        sel +
        '<button class="cmd-module-remove" onclick="removeModule(\'' + escAttr(p.id) + '\',' + idx + ');event.stopPropagation()" title="Remove">×</button>' +
      '</div>';
    }).join('');
  } else {
    rows = '<div style="color:var(--muted);font-size:12px;padding:8px 0">No modules yet.</div>';
  }
  return '<div class="cmd-module-grid">' + rows + '</div>' +
    '<button class="cmd-add-btn" onclick="openAddModal(\'' + escAttr(p.id) + '\');event.stopPropagation()">+ Add Module</button>';
}

function toggleClient(id) {
  expandedClient = expandedClient === id ? null : id;
  renderCommand();
}

function setModStatus(clientId, idx, status) {
  if (!state.os_data.automations) state.os_data.automations = {};
  if (!state.os_data.automations[clientId]) return;
  state.os_data.automations[clientId][idx].status = status;
  scheduleSave();
  renderCommand();
}

function removeModule(clientId, idx) {
  if (!state.os_data.automations || !state.os_data.automations[clientId]) return;
  state.os_data.automations[clientId].splice(idx, 1);
  scheduleSave();
  renderCommand();
}

// ══ Add Module Modal ═══════════════════════════════════════════════════════
function openAddModal(clientId) {
  addModalClientId = clientId;
  selectedBpIds = [];
  var existing = (state.os_data.automations && state.os_data.automations[clientId] || []).map(function(m) { return m.blueprintId; });
  var grid = document.getElementById('add-module-grid');
  var pp = (state.os_data.prospects || []).find(function(p) { return p.id == clientId; });
  document.getElementById('add-modal-title').textContent = 'Add Module' + (pp ? ' — ' + (pp.company_name || pp.name) : '');
  grid.innerHTML = BLUEPRINTS.map(function(bp) {
    if (existing.indexOf(bp.id) !== -1) return '';
    return '<div class="au-add-row" id="addrow-' + bp.id + '" onclick="toggleBpSelect(\'' + bp.id + '\')">' +
      '<span style="font-size:16px">' + bp.icon + '</span>' +
      '<span class="au-add-row-name">' + escHtml(bp.name) + '</span>' +
      '<span style="font-size:10px;color:var(--muted);margin-right:8px">' + bp.hoursPerWeek + ' hrs/wk</span>' +
      '<span class="au-add-row-price">$' + bp.price.toLocaleString() + '</span>' +
    '</div>';
  }).filter(Boolean).join('');
  if (!grid.innerHTML.trim()) {
    grid.innerHTML = '<div style="color:var(--muted);font-size:12px;text-align:center;padding:16px">All modules already added.</div>';
  }
  document.getElementById('add-module-notes').value = '';
  document.getElementById('add-modal-backdrop').classList.add('open');
}

function toggleBpSelect(id) {
  var idx = selectedBpIds.indexOf(id);
  if (idx === -1) selectedBpIds.push(id); else selectedBpIds.splice(idx, 1);
  document.querySelectorAll('.au-add-row').forEach(function(el) { el.classList.remove('selected'); });
  selectedBpIds.forEach(function(bid) {
    var row = document.getElementById('addrow-' + bid);
    if (row) row.classList.add('selected');
  });
}

function closeAddModal(e) {
  if (e && e.target !== document.getElementById('add-modal-backdrop')) return;
  document.getElementById('add-modal-backdrop').classList.remove('open');
  selectedBpIds = []; addModalClientId = null;
}

function confirmAddModule() {
  if (!addModalClientId || selectedBpIds.length === 0) { showToast('Select a module'); return; }
  var notes = document.getElementById('add-module-notes').value.trim();
  if (!state.os_data.automations) state.os_data.automations = {};
  if (!state.os_data.automations[addModalClientId]) state.os_data.automations[addModalClientId] = [];
  selectedBpIds.forEach(function(bid) {
    state.os_data.automations[addModalClientId].push({
      blueprintId: bid, status: 'planned', notes: notes, addedAt: new Date().toISOString()
    });
  });
  scheduleSave();
  document.getElementById('add-modal-backdrop').classList.remove('open');
  selectedBpIds = []; addModalClientId = null;
  renderCommand();
  showToast(selectedBpIds.length > 1 ? 'Modules added' : 'Module added');
}

// ══ BUILD ══════════════════════════════════════════════════════════════════
var TRIGGER_PRESETS = [
  { label:'Form Submitted',    tool:'Typeform',  type:'trigger' },
  { label:'Job Completed',     tool:'Jobber',    type:'trigger' },
  { label:'Payment Received',  tool:'Stripe',    type:'trigger' },
  { label:'New Lead',          tool:'Airtable',  type:'trigger' },
  { label:'Scheduled (Daily)', tool:'Make.com',  type:'trigger' },
  { label:'Invoice Overdue',   tool:'Jobber',    type:'trigger' },
];

function getSpecs() { return state.os_data.auto_specs || []; }
function setSpecs(a) { state.os_data.auto_specs = a; }

function initBuild() {
  populateSpecClientDropdown();
  renderTriggerPalette();
  renderSavedSpecs();
  if (currentSpecId) {
    loadSpec(currentSpecId);
  } else {
    newSpec();
  }
}

function populateSpecClientDropdown() {
  var pp = (state.os_data.prospects || []).filter(function(p) {
    return p.stage === 'Closed' || p.stage === 'Proposal Sent' || p.stage === 'Audit Scheduled' || p.stage === 'Warm';
  });
  var sel = document.getElementById('spec-client');
  var cur = sel.value;
  sel.innerHTML = '<option value="">Assign to client…</option>' +
    pp.map(function(p) {
      return '<option value="' + escAttr(p.id) + '">' + escHtml(p.name) + '</option>';
    }).join('');
  if (cur) sel.value = cur;
}

function renderTriggerPalette() {
  var el = document.getElementById('trigger-palette');
  if (!el) return;
  el.innerHTML = TRIGGER_PRESETS.map(function(t, idx) {
    return '<button style="text-align:left;padding:6px 10px;border:1px solid var(--border);border-radius:5px;background:var(--surface2);color:var(--muted);font-size:11px;cursor:pointer;transition:all .12s" ' +
      'onmouseover="this.style.borderColor=\'var(--accent)\';this.style.color=\'var(--text)\'" ' +
      'onmouseout="this.style.borderColor=\'var(--border)\';this.style.color=\'var(--muted)\'" ' +
      'onclick="addTriggerPreset(' + idx + ')">' +
      '<span style="color:var(--accent);margin-right:6px">⚡</span>' + escHtml(t.label) + ' <span style="float:right;font-size:9px;opacity:.6">' + escHtml(t.tool) + '</span>' +
    '</button>';
  }).join('');
}

function addTriggerPreset(idx) {
  var t = TRIGGER_PRESETS[idx];
  if (flowSteps.length === 0 || flowSteps[0].type !== 'trigger') {
    flowSteps.unshift({ type: 'trigger', label: t.label, tool: t.tool, notes: '' });
  } else {
    flowSteps[0] = { type: 'trigger', label: t.label, tool: t.tool, notes: '' };
  }
  renderFlow();
}

function newSpec() {
  currentSpecId = null;
  flowSteps = [];
  document.getElementById('spec-name').value = '';
  document.getElementById('spec-client').value = '';
  document.getElementById('delete-spec-btn').style.display = 'none';
  renderFlow();
  renderSavedSpecs();
}

function addStep(type) {
  var defaults = {
    action:    { label: 'New Action',    tool: 'Make.com', notes: '' },
    condition: { label: 'Check Condition', tool: '',       notes: '' },
    end:       { label: 'Done',          tool: '',         notes: '' }
  };
  flowSteps.push(Object.assign({ type: type }, defaults[type]));
  renderFlow();
}

function renderFlow() {
  var canvas = document.getElementById('flow-canvas');
  if (!canvas) return;
  if (flowSteps.length === 0) {
    canvas.innerHTML = '<div style="padding:40px;text-align:center;color:var(--muted);border:2px dashed var(--border);border-radius:10px;font-size:13px">' +
      'Start with a trigger from the right panel, or click + Action below.' +
    '</div>';
    return;
  }
  canvas.innerHTML = flowSteps.map(function(step, idx) {
    var typeCls = 'type-' + step.type;
    var cardCls = 'flow-card' + (step.type === 'trigger' ? ' trigger-node' : '') + (step.type === 'condition' ? ' condition-node' : '');
    return '<div class="flow-node">' +
      (idx > 0 ? '<div class="flow-connector"></div>' : '') +
      '<div class="' + cardCls + '">' +
        '<div class="flow-card-header">' +
          '<span class="flow-card-type-badge ' + typeCls + '">' + step.type + '</span>' +
          '<span class="flow-card-label">' + escHtml(step.label) + '</span>' +
          (step.tool ? '<span class="flow-card-tool">' + escHtml(step.tool) + '</span>' : '') +
          '<button class="flow-card-remove" onclick="editStep(' + idx + ')" title="Edit" style="color:var(--muted);margin-right:4px">✎</button>' +
          '<button class="flow-card-remove" onclick="removeStep(' + idx + ')" title="Remove">×</button>' +
        '</div>' +
        (step.notes ? '<div class="flow-card-body"><div class="flow-card-notes">' + escHtml(step.notes) + '</div></div>' : '') +
      '</div>' +
    '</div>';
  }).join('');
}

function editStep(idx) {
  editingStepIdx = idx;
  var step = flowSteps[idx];
  document.getElementById('step-modal-title').textContent = 'Edit ' + step.type.charAt(0).toUpperCase() + step.type.slice(1);
  document.getElementById('step-edit-idx').value = idx;
  document.getElementById('step-label').value = step.label || '';
  document.getElementById('step-tool').value = step.tool || '';
  document.getElementById('step-notes').value = step.notes || '';
  document.getElementById('step-modal-backdrop').classList.add('open');
}

function closeStepModal(e) {
  if (e && e.target !== document.getElementById('step-modal-backdrop')) return;
  document.getElementById('step-modal-backdrop').classList.remove('open');
}

function saveStep() {
  var idx = parseInt(document.getElementById('step-edit-idx').value);
  if (isNaN(idx) || !flowSteps[idx]) return;
  flowSteps[idx].label = document.getElementById('step-label').value;
  flowSteps[idx].tool  = document.getElementById('step-tool').value;
  flowSteps[idx].notes = document.getElementById('step-notes').value;
  document.getElementById('step-modal-backdrop').classList.remove('open');
  renderFlow();
}

function removeStep(idx) { flowSteps.splice(idx, 1); renderFlow(); }

function saveSpec() {
  var name = document.getElementById('spec-name').value.trim();
  if (!name) { showToast('Name this spec first'); return; }
  var clientId = document.getElementById('spec-client').value;
  var spec = {
    id: currentSpecId || genId(),
    name: name,
    clientId: clientId,
    steps: JSON.parse(JSON.stringify(flowSteps)),
    savedAt: new Date().toISOString()
  };
  var specs = getSpecs();
  if (currentSpecId) {
    var idx = specs.findIndex(function(s) { return s.id == currentSpecId; });
    if (idx !== -1) specs[idx] = spec; else specs.push(spec);
  } else {
    specs.push(spec);
    currentSpecId = spec.id;
  }
  setSpecs(specs);
  scheduleSave();
  renderSavedSpecs();
  document.getElementById('delete-spec-btn').style.display = '';
  showToast('Spec saved');
}

function loadSpec(id) {
  var spec = getSpecs().find(function(s) { return s.id == id; });
  if (!spec) return;
  currentSpecId = spec.id;
  flowSteps = JSON.parse(JSON.stringify(spec.steps || []));
  document.getElementById('spec-name').value = spec.name || '';
  document.getElementById('spec-client').value = spec.clientId || '';
  document.getElementById('delete-spec-btn').style.display = '';
  renderFlow();
  renderSavedSpecs();
}

function deleteSpec() {
  if (!currentSpecId) return;
  setSpecs(getSpecs().filter(function(s) { return s.id != currentSpecId; }));
  scheduleSave();
  newSpec();
  showToast('Spec deleted');
}

function exportSpec() {
  var name = document.getElementById('spec-name').value || 'Untitled Spec';
  var clientId = document.getElementById('spec-client').value;
  var pp = (state.os_data.prospects || []).find(function(p) { return p.id == clientId; });
  var clientName = pp ? (pp.company_name || pp.name || 'Unassigned') : 'Unassigned';
  var stepsText = flowSteps.map(function(s, i) {
    return (i + 1) + '. [' + s.type.toUpperCase() + '] ' + s.label + (s.tool ? ' (' + s.tool + ')' : '') + (s.notes ? '\n   → ' + s.notes : '');
  }).join('\n');
  var text = '=== AUTOMATION SPEC ===\n' +
    name + '\n' +
    'Client: ' + clientName + '\n' +
    'Date: ' + new Date().toLocaleDateString() + '\n\n' +
    'FLOW:\n' + stepsText + '\n\n' +
    'Steps: ' + flowSteps.length;
  var blob = new Blob([text], { type: 'text/plain' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = name.replace(/\s+/g, '_') + '.txt';
  a.click(); URL.revokeObjectURL(url);
}

function renderSavedSpecs() {
  var el = document.getElementById('saved-specs-list');
  if (!el) return;
  var specs = getSpecs();
  if (specs.length === 0) {
    el.innerHTML = '<div style="color:var(--muted);font-size:11px;padding:4px 0">No specs saved yet.</div>';
    return;
  }
  var pp = state.os_data.prospects || [];
  el.innerHTML = specs.map(function(s) {
    var client = pp.find(function(p) { return p.id == s.clientId; });
    return '<div class="build-spec-item' + (s.id == currentSpecId ? ' active' : '') + '" onclick="loadSpec(\'' + escAttr(s.id) + '\')">' +
      '<div class="build-spec-item-name">' + escHtml(s.name) + '</div>' +
      '<div class="build-spec-item-meta">' + (client ? escHtml(client.company_name || client.name) : 'Unassigned') + ' · ' + (s.steps || []).length + ' steps</div>' +
    '</div>';
  }).join('');
}

// ══ LIBRARY ════════════════════════════════════════════════════════════════
function renderLibrary() {
  var areas = ['All'].concat([...new Set(BLUEPRINTS.map(function(b) { return b.area; }))]);
  var filtersEl = document.getElementById('lib-filters');
  filtersEl.innerHTML = areas.map(function(a) {
    return '<button class="lib-filter-btn' + (libFilter === a ? ' active' : '') + '" onclick="setLibFilter(\'' + escAttr(a) + '\')">' + escHtml(a) + '</button>';
  }).join('');

  var filtered = libFilter === 'All' ? BLUEPRINTS : BLUEPRINTS.filter(function(b) { return b.area === libFilter; });
  var am = state.os_data.automations || {};
  var pp = state.os_data.prospects || [];

  var el = document.getElementById('lib-grid');
  el.innerHTML = filtered.map(function(bp) {
    var monthlyRoi = bp.hoursPerWeek * 4 * 75; // ~$75/hr labor cost
    var paybackWeeks = Math.ceil(bp.price / (bp.hoursPerWeek * 75));
    // How many clients have this
    var clientsWithIt = pp.filter(function(p) {
      return am[p.id] && am[p.id].some(function(m) { return m.blueprintId === bp.id; });
    });

    var tools = bp.tools.map(function(t) { return '<span class="lib-tool-tag">' + escHtml(t) + '</span>'; }).join('');
    var steps = bp.steps.map(function(s) { return '<div class="lib-step-item">→ ' + escHtml(s) + '</div>'; }).join('');

    return '<div class="lib-card">' +
      '<div class="lib-card-header">' +
        '<div class="lib-card-icon">' + bp.icon + '</div>' +
        '<div><div class="lib-card-title">' + escHtml(bp.name) + '</div>' +
        '<div class="lib-card-area">' + escHtml(bp.area) + '</div></div>' +
      '</div>' +
      '<div class="lib-card-desc">' + escHtml(bp.desc) + '</div>' +
      '<div class="lib-roi-bar">' +
        '<div class="lib-roi-item"><div class="lib-roi-val accent">$' + bp.price.toLocaleString() + '</div><div class="lib-roi-label">Price</div></div>' +
        '<div class="lib-roi-item"><div class="lib-roi-val green">' + bp.hoursPerWeek + ' hrs</div><div class="lib-roi-label">Saved / Wk</div></div>' +
        '<div class="lib-roi-item"><div class="lib-roi-val blue">$' + monthlyRoi.toLocaleString() + '</div><div class="lib-roi-label">Client ROI / Mo</div></div>' +
        '<div class="lib-roi-item"><div class="lib-roi-val">' + paybackWeeks + ' wks</div><div class="lib-roi-label">Payback</div></div>' +
      '</div>' +
      '<div class="lib-steps">' + steps + '</div>' +
      '<div class="lib-tools">' + tools + '</div>' +
      (clientsWithIt.length > 0 ? '<div class="lib-clients-using">Deployed to <span>' + clientsWithIt.length + ' client' + (clientsWithIt.length > 1 ? 's' : '') + '</span></div>' : '') +
      '<div class="lib-card-footer">' +
        '<button class="btn btn-primary btn-sm" onclick="assignBpToClient(\'' + escAttr(bp.id) + '\')">Assign to Client</button>' +
        '<button class="btn btn-ghost btn-sm" onclick="openBuildWithBp(\'' + escAttr(bp.id) + '\')">Build Spec</button>' +
      '</div>' +
    '</div>';
  }).join('');
}

function setLibFilter(area) { libFilter = area; renderLibrary(); }

function assignBpToClient(bpId) {
  var pp = (state.os_data.prospects || []).filter(function(p) {
    return p.stage === 'Closed' || p.stage === 'Proposal Sent' || p.stage === 'Audit Scheduled';
  });
  if (pp.length === 0) { showToast('No active clients in pipeline'); return; }
  // If only one client, add directly; otherwise open modal
  if (pp.length === 1) {
    addBpToClient(pp[0].id, bpId);
    return;
  }
  addModalClientId = null;
  selectedBpIds = [bpId];
  var bp = BP_MAP[bpId];
  document.getElementById('add-modal-title').textContent = 'Assign: ' + (bp ? bp.name : bpId);
  // Show client picker instead of blueprint picker
  var grid = document.getElementById('add-module-grid');
  grid.innerHTML = '<div style="margin-bottom:8px"><label class="form-label">Select Client</label>' +
    '<select class="form-select" id="assign-client-sel">' +
      pp.map(function(p) { return '<option value="' + escAttr(p.id) + '">' + escHtml(p.company_name || p.name) + '</option>'; }).join('') +
    '</select></div>';
  document.getElementById('add-module-notes').value = '';
  // Patch confirmAddModule for this flow
  document.getElementById('add-modal-backdrop').classList.add('open');
  // Override confirm for client-assign flow
  window._assignBpMode = bpId;
}

function addBpToClient(clientId, bpId) {
  var existing = (state.os_data.automations && state.os_data.automations[clientId] || []).map(function(m) { return m.blueprintId; });
  if (existing.indexOf(bpId) !== -1) { showToast('Already added to this client'); return; }
  if (!state.os_data.automations) state.os_data.automations = {};
  if (!state.os_data.automations[clientId]) state.os_data.automations[clientId] = [];
  state.os_data.automations[clientId].push({ blueprintId: bpId, status: 'planned', notes: '', addedAt: new Date().toISOString() });
  scheduleSave();
  renderLibrary();
  showToast('Module assigned');
}

function openBuildWithBp(bpId) {
  var bp = BP_MAP[bpId];
  if (!bp) return;
  showView('build');
  setTimeout(function() {
    newSpec();
    document.getElementById('spec-name').value = bp.name + ' — Spec';
    flowSteps = [
      { type: 'trigger', label: 'Trigger Event', tool: bp.tools[0] || 'Make.com', notes: '' }
    ];
    bp.steps.forEach(function(s) {
      flowSteps.push({ type: 'action', label: s, tool: bp.tools[0] || 'Make.com', notes: '' });
    });
    flowSteps.push({ type: 'end', label: 'Done', tool: '', notes: '' });
    renderFlow();
  }, 50);
}

// Patch confirm modal to handle assign-to-client flow
var _origConfirmAddModule = null;
function confirmAddModule() {
  if (window._assignBpMode) {
    var sel = document.getElementById('assign-client-sel');
    var clientId = sel ? sel.value : null;
    if (!clientId) { showToast('Select a client'); return; }
    addBpToClient(clientId, window._assignBpMode);
    window._assignBpMode = null;
    document.getElementById('add-modal-backdrop').classList.remove('open');
    return;
  }
  if (!addModalClientId || selectedBpIds.length === 0) { showToast('Select a module'); return; }
  var notes = document.getElementById('add-module-notes').value.trim();
  if (!state.os_data.automations) state.os_data.automations = {};
  if (!state.os_data.automations[addModalClientId]) state.os_data.automations[addModalClientId] = [];
  selectedBpIds.forEach(function(bid) {
    state.os_data.automations[addModalClientId].push({
      blueprintId: bid, status: 'planned', notes: notes, addedAt: new Date().toISOString()
    });
  });
  scheduleSave();
  document.getElementById('add-modal-backdrop').classList.remove('open');
  selectedBpIds = []; addModalClientId = null;
  renderCommand();
  showToast('Module added');
}

// ══ Init ═══════════════════════════════════════════════════════════════════
async function init() {
  renderNav('automations');
  var d = new Date();
  var days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  document.getElementById('header-date').textContent = days[d.getDay()] + ', ' + months[d.getMonth()] + ' ' + d.getDate();
  document.getElementById('week-badge').textContent = 'W' + state.current_week;
  await loadState();
  document.getElementById('week-badge').textContent = 'W' + state.current_week;
  renderCommand();
}

init();
</script>
