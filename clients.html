<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>StructTech — Pipeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
/* ── Sub-nav ── */
.df-subnav {
  display: flex; align-items: center; gap: 2px;
  padding: 0 24px; height: 38px;
  background: var(--surface); border-bottom: 1px solid var(--border);
  overflow-x: auto; flex-shrink: 0;
}
.df-subnav-btn {
  font-family: 'DM Mono', monospace; font-size: 10px; text-transform: uppercase;
  letter-spacing: 0.07em; padding: 5px 12px; border-radius: 4px;
  border: none; background: transparent; color: var(--muted);
  cursor: pointer; white-space: nowrap; transition: all 0.15s;
}
.df-subnav-btn:hover { color: var(--text); }
.df-subnav-btn.active { background: var(--surface2); color: var(--accent); }

/* ── Pipeline kanban ── */
.pl-board {
  display: flex; gap: 12px; overflow-x: auto;
  padding: 4px 0 16px 0; align-items: flex-start;
}
.pl-col { flex-shrink: 0; width: 210px; }
.pl-col-header {
  display: flex; align-items: center; gap: 6px;
  padding: 8px 0 10px 0; margin-bottom: 6px;
  border-bottom: 2px solid var(--border);
}
.pl-col-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.pl-col-label { font-family: 'DM Mono', monospace; font-size: 10px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); flex: 1; }
.pl-col-count { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--border2); }

/* ── Pipeline cards ── */
.pl-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 7px; padding: 11px 12px; margin-bottom: 8px;
  cursor: pointer; transition: border-color 0.15s;
}
.pl-card:hover { border-color: var(--border2); }
.pl-card.selected { border-color: var(--accent); background: var(--surface2); }
.pl-card-name { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
.pl-card-owner { font-size: 11px; color: var(--muted); margin-bottom: 3px; }
.pl-card-trade { font-size: 10px; color: var(--border2); margin-bottom: 8px; }
.pl-card-icp { display: flex; align-items: center; gap: 6px; }
.pl-card-bar { flex: 1; height: 3px; background: var(--border); border-radius: 2px; }
.pl-card-bar-fill { height: 3px; border-radius: 2px; transition: width 0.3s; }
.pl-card-score { font-family: 'DM Mono', monospace; font-size: 9px; }
.pl-sup-badge {
  font-family: 'DM Mono', monospace; font-size: 8px; padding: 1px 4px;
  border-radius: 2px; background: rgba(96,165,250,0.12); color: var(--blue);
  float: right; margin-left: 4px;
}

/* ── Detail panel ── */
.pl-detail {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; padding: 18px; margin-bottom: 16px;
}
.pl-detail-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 14px; }
.pl-detail-name { font-size: 16px; font-weight: 700; }
.pl-detail-owner { font-size: 12px; color: var(--muted); margin-top: 2px; }
.pl-detail-biz { font-size: 11px; color: var(--accent); margin-top: 3px; }
.pl-detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
.pl-detail-field { background: var(--surface2); border-radius: 5px; padding: 8px 10px; }
.pl-detail-flabel { font-family: 'DM Mono', monospace; font-size: 9px; text-transform: uppercase; color: var(--muted); margin-bottom: 3px; }
.pl-detail-fval { font-size: 12px; }
.pl-detail-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
.pl-icp-bar-wrap { background: var(--bg); border-radius: 4px; height: 6px; margin-bottom: 6px; }
.pl-icp-bar-fill { height: 6px; border-radius: 4px; transition: width 0.3s; }

/* ── Intake form ── */
.intake-icp-panel {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 7px; padding: 14px 16px; margin-bottom: 18px;
}
.intake-icp-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.intake-icp-score { font-family: 'Bebas Neue', cursive; font-size: 28px; line-height: 1; }
.intake-icp-verdict { font-family: 'DM Mono', monospace; font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; margin-top: 2px; }
.intake-icp-bar { height: 5px; background: var(--border); border-radius: 3px; margin-bottom: 10px; }
.intake-icp-bar-fill { height: 5px; border-radius: 3px; transition: width 0.3s; }
.intake-icp-signals { display: flex; gap: 10px; }
.intake-icp-signal { font-size: 11px; }
.intake-icp-good { color: var(--accent2); }
.intake-icp-warn { color: var(--warn); }

.intake-section-label {
  font-family: 'DM Mono', monospace; font-size: 10px; text-transform: uppercase;
  letter-spacing: 0.07em; color: var(--muted); margin-bottom: 6px;
}
.intake-biz-row { display: flex; gap: 6px; margin-bottom: 14px; }
.intake-biz-btn {
  flex: 1; padding: 8px 6px; border-radius: 5px; border: 1px solid var(--border);
  background: var(--surface2); color: var(--muted);
  font-family: 'DM Mono', monospace; font-size: 10px; text-transform: uppercase;
  letter-spacing: 0.05em; cursor: pointer; transition: all 0.15s; text-align: center;
}
.intake-biz-btn.active {
  border-color: var(--accent); color: var(--accent);
  background: rgba(200,240,96,0.08);
}
.intake-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
.intake-grid.full { grid-template-columns: 1fr; }
.intake-group { display: flex; flex-direction: column; gap: 4px; }
.intake-check-row {
  display: flex; align-items: center; gap: 8px; padding: 8px 10px;
  background: var(--surface2); border-radius: 5px; border: 1px solid var(--border);
  cursor: pointer; margin-bottom: 6px;
}
.intake-check-row input { accent-color: var(--accent2); }
.leak-tags { display: flex; flex-wrap: wrap; gap: 6px; }
.leak-tag {
  font-size: 11px; padding: 4px 9px; border-radius: 4px;
  border: 1px solid var(--border); background: var(--surface2); color: var(--muted);
  cursor: pointer; transition: all 0.15s;
}
.leak-tag.active {
  border-color: var(--accent); color: var(--accent);
  background: rgba(200,240,96,0.08);
}

/* ── Audit view ── */
.audit-progress { display: flex; gap: 4px; margin-bottom: 18px; }
.audit-prog-seg { flex: 1; height: 4px; border-radius: 2px; background: var(--border); cursor: pointer; transition: background 0.2s; }
.audit-prog-seg.done { background: var(--accent); }
.audit-prog-seg.current { background: var(--blue); }
.audit-area-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin-bottom: 14px; }
.audit-area-header { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--surface2); }
.audit-area-icon { font-size: 20px; }
.audit-area-title { font-size: 13px; font-weight: 600; }
.audit-area-desc { font-size: 11px; color: var(--muted); margin-top: 2px; }
.audit-area-count { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--muted); margin-left: auto; }
.audit-question { padding: 14px 16px; border-bottom: 1px solid var(--border); }
.audit-question:last-child { border-bottom: none; }
.audit-q-text { font-size: 13px; color: var(--text); margin-bottom: 10px; line-height: 1.5; }
.audit-opts { display: flex; flex-direction: column; gap: 6px; }
.audit-opt {
  padding: 9px 12px; border-radius: 5px; border: 1px solid var(--border);
  background: var(--bg); color: var(--muted); font-size: 12px;
  cursor: pointer; text-align: left; transition: all 0.15s;
}
.audit-opt:hover { border-color: var(--border2); color: var(--text); }
.audit-opt.selected { border-color: var(--accent); color: var(--accent); background: rgba(200,240,96,0.07); }

/* ── Audit results ── */
.audit-result-tier {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; padding: 18px; margin-bottom: 16px;
}
.audit-tier-name { font-family: 'Bebas Neue', cursive; font-size: 26px; color: var(--text); }
.audit-tier-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
.audit-ranking-card { background: var(--surface); border: 1px solid var(--border); border-radius: 7px; padding: 12px 14px; margin-bottom: 8px; }
.audit-rank-num { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--muted); margin-right: 6px; }
.audit-rank-title { font-size: 13px; font-weight: 600; }
.audit-rank-label { font-family: 'DM Mono', monospace; font-size: 9px; padding: 2px 6px; border-radius: 3px; float: right; }
.audit-rank-bar { height: 3px; background: var(--border); border-radius: 2px; margin: 8px 0 6px; }
.audit-rank-fill { height: 3px; border-radius: 2px; }
.audit-rank-why { font-size: 11px; color: var(--muted); margin-bottom: 6px; line-height: 1.5; }
.audit-tool-tag { font-family: 'DM Mono', monospace; font-size: 9px; padding: 2px 6px; border-radius: 3px; background: var(--surface2); color: var(--accent); margin-right: 4px; display: inline-block; margin-bottom: 3px; }

/* ── Proposal ── */
.prop-doc {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; padding: 28px; max-width: 720px;
}
.prop-doc-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
.prop-brand { font-family: 'Bebas Neue', cursive; font-size: 22px; color: var(--accent); letter-spacing: 0.05em; }
.prop-tagline { font-size: 11px; color: var(--muted); margin-top: 2px; }
.prop-contact { font-family: 'DM Mono', monospace; font-size: 9px; color: var(--border2); margin-top: 3px; }
.prop-to { text-align: right; font-size: 12px; color: var(--muted); }
.prop-to strong { color: var(--text); }
.prop-divider { border: none; border-top: 1px solid var(--border); margin: 16px 0; }
.prop-section-label { font-family: 'DM Mono', monospace; font-size: 9px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 10px; }
.prop-intro { font-size: 13px; line-height: 1.75; color: var(--text); opacity: 0.9; margin-bottom: 20px; }
.prop-finding { background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 12px 14px; margin-bottom: 8px; }
.prop-finding-title { font-size: 13px; font-weight: 600; margin-bottom: 3px; }
.prop-finding-why { font-size: 11px; color: var(--muted); }
.prop-scope-box { background: var(--surface2); border: 1px solid var(--accent); border-radius: 7px; padding: 16px; margin-bottom: 20px; }
.prop-tier-name { font-family: 'Bebas Neue', cursive; font-size: 24px; color: var(--text); }
.prop-price { font-family: 'Bebas Neue', cursive; font-size: 28px; color: var(--accent); }
.prop-includes { list-style: none; margin-top: 12px; }
.prop-includes li { font-size: 12px; color: var(--text); padding: 3px 0; display: flex; gap: 8px; }
.prop-includes li::before { content: '✓'; color: var(--accent2); flex-shrink: 0; font-weight: 700; }
.prop-process-steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; }
.prop-step { text-align: center; }
.prop-step-num { width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: #0d0f0e; font-family: 'Bebas Neue', cursive; font-size: 14px; display: flex; align-items: center; justify-content: center; margin: 0 auto 6px; }
.prop-step-label { font-size: 10px; color: var(--muted); }

/* ── Objections ── */
.obj-layout { display: flex; gap: 0; }
.obj-sidebar {
  width: 200px; flex-shrink: 0; border-right: 1px solid var(--border);
  padding: 0 12px 0 0; margin-right: 20px;
}
.obj-cat-btn {
  width: 100%; text-align: left; padding: 7px 10px; border-radius: 5px;
  border: none; background: transparent; color: var(--muted);
  font-size: 12px; cursor: pointer; margin-bottom: 2px; transition: all 0.15s;
}
.obj-cat-btn:hover { color: var(--text); background: var(--surface2); }
.obj-cat-btn.active { color: var(--accent); background: var(--surface2); }
.obj-content { flex: 1; min-width: 0; }
.obj-item {
  border: 1px solid var(--border); border-radius: 7px;
  overflow: hidden; margin-bottom: 8px;
}
.obj-item.open { border-color: var(--accent); }
.obj-item-trigger {
  width: 100%; text-align: left; padding: 13px 14px;
  background: var(--surface); border: none; cursor: pointer;
  display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;
}
.obj-item-trigger:hover { background: var(--surface2); }
.obj-trigger-text { font-size: 13px; color: var(--text); font-style: italic; }
.obj-chevron { font-size: 10px; color: var(--muted); flex-shrink: 0; margin-top: 2px; }
.obj-body { padding: 14px; background: var(--bg); border-top: 1px solid var(--border); display: none; }
.obj-body.open { display: block; }
.obj-response-label { font-family: 'DM Mono', monospace; font-size: 9px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--accent); margin-bottom: 8px; }
.obj-response-text { font-size: 12px; color: var(--text); line-height: 1.75; white-space: pre-line; margin-bottom: 12px; }
.obj-followup-label { font-family: 'DM Mono', monospace; font-size: 9px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--blue); margin-bottom: 6px; }
.obj-followup-text { font-size: 12px; color: var(--muted); line-height: 1.65; font-style: italic; }
@media (max-width: 640px) {
  .obj-layout { flex-direction: column; }
  .obj-sidebar { width: 100%; border-right: none; padding: 0 0 12px 0; margin-right: 0; border-bottom: 1px solid var(--border); margin-bottom: 14px; display: flex; flex-wrap: wrap; gap: 4px; }
  .obj-cat-btn { width: auto; }
}

/* ── Close guide ── */
.close-tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 18px; }
.close-tab-btn {
  padding: 8px 14px; border: none; background: transparent; font-size: 12px;
  cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent;
  font-family: 'DM Mono', monospace; text-transform: uppercase; font-size: 10px;
  letter-spacing: 0.06em; transition: all 0.15s;
}
.close-tab-btn:hover { color: var(--text); }
.close-tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
.close-check-item {
  display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px;
  border-radius: 6px; border: 1px solid var(--border); background: var(--surface2);
  margin-bottom: 6px; cursor: pointer; transition: all 0.15s;
}
.close-check-item.checked { background: rgba(74,222,128,0.06); border-color: rgba(74,222,128,0.25); }
.close-check-icon { font-size: 12px; flex-shrink: 0; margin-top: 1px; color: var(--border2); font-family: 'DM Mono', monospace; }
.close-check-item.checked .close-check-icon { color: var(--accent2); }
.close-check-text { font-size: 12px; color: var(--text); }
.close-check-item.checked .close-check-text { color: var(--muted); }
.close-script-setup { background: var(--surface2); border: 1px solid var(--accent); border-radius: 6px; padding: 12px 14px; margin-bottom: 14px; }
.close-script-title { font-family: 'Bebas Neue', cursive; font-size: 18px; color: var(--accent); }
.close-script-subtitle { font-size: 11px; color: var(--muted); margin-top: 4px; }
.close-step { border: 1px solid var(--border); border-radius: 6px; overflow: hidden; margin-bottom: 8px; }
.close-step-label { padding: 7px 12px; background: var(--surface2); font-family: 'DM Mono', monospace; font-size: 9px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.close-step-body { padding: 12px 14px; background: var(--bg); font-size: 12px; color: var(--text); line-height: 1.7; font-style: italic; }

/* ── Shared view styles ── */
.view-header { margin-bottom: 20px; }
.view-title { font-family: 'Bebas Neue', cursive; font-size: 22px; color: var(--text); letter-spacing: 0.04em; margin-bottom: 4px; }
.view-sub { font-size: 12px; color: var(--muted); }
.max-600 { max-width: 600px; }
.max-760 { max-width: 760px; }

/* ── Empty state ── */
.df-empty { text-align: center; padding: 40px 24px; color: var(--muted); font-size: 13px; }
.df-empty-icon { font-size: 28px; margin-bottom: 10px; }

/* ── Print styles for proposal ── */
@media print {
  header, .df-subnav, #app-nav, .no-print { display: none !important; }
  body { background: #fff !important; color: #111 !important; }
  .prop-doc { background: white; color: #111; border: none; padding: 0; }
  .prop-brand { color: #c25000 !important; }
  .prop-price { color: #c25000 !important; }
  .prop-includes li::before { color: #1a7a3b !important; }
}

@media (max-width: 640px) {
  .intake-grid { grid-template-columns: 1fr; }
  .pl-detail-grid { grid-template-columns: 1fr; }
  .prop-doc { padding: 16px; }
  .prop-process-steps { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>
<body>

<header>
  <div class="header-logo">
    <span class="logo-main">STRUCTTECH</span>
    <span class="logo-div">/</span>
    <span class="logo-ops">OPS</span>
  </div>
  <div id="sync-status" class="sync-status sync-loading">● Loading</div>
  <div id="header-date" class="header-date"></div>
  <div class="week-badge" style="font-size:13px;padding:4px 10px;color:var(--muted);border-color:var(--border)">Pipeline</div>
</header>

<div id="app-nav" class="app-nav"></div>

<div class="df-subnav">
  <button class="df-subnav-btn active" data-view="pipeline" onclick="showView('pipeline')">Pipeline</button>
  <button class="df-subnav-btn" data-view="intake" onclick="showView('intake')">New Lead</button>
  <button class="df-subnav-btn" data-view="audit" onclick="showView('audit')">Audit</button>
  <button class="df-subnav-btn" data-view="proposal" onclick="showView('proposal')">Proposal</button>
  <button class="df-subnav-btn" data-view="objections" onclick="showView('objections')">Objections</button>
  <button class="df-subnav-btn" data-view="close" onclick="showView('close')">Close</button>
</div>

<main>
  <div id="view-pipeline" class="df-view"></div>
  <div id="view-intake" class="df-view hidden"></div>
  <div id="view-audit" class="df-view hidden"></div>
  <div id="view-proposal" class="df-view hidden"></div>
  <div id="view-objections" class="df-view hidden"></div>
  <div id="view-close" class="df-view hidden"></div>
</main>

<script src="shared.js"></script>
<script src="nav.js"></script>
<script>
// ─── CONSTANTS ────────────────────────────────────────────────────────────────

var STAGES = ['Cold','Warm','Audit Scheduled','Proposal Sent','Closed'];
var STAGE_COLORS = {
  'Cold':             'var(--muted)',
  'Warm':             'var(--warn)',
  'Audit Scheduled':  'var(--blue)',
  'Proposal Sent':    'var(--accent)',
  'Closed':           'var(--accent2)'
};

var BUSINESS_TYPES = ['Trade Contractor','Building / Material Supplier','Other'];

var TRADE_TYPES = [
  'Residential Remodeling (Kitchen/Bath)','Framing Contractor','Custom Home Builder',
  'HVAC','Electrical','Plumbing','Roofing','General Contractor','Other'
];
var SUPPLIER_TYPES = [
  'Lumber / Building Materials','Metal / Steel Supplier','Roofing Materials',
  'Flooring / Tile Supplier','Plumbing / HVAC Supply','Electrical Supply',
  'Concrete / Masonry Supply','Hardware / Fasteners','Equipment Rental','Other Supplier'
];
var ICP_TRADES = ['Residential Remodeling (Kitchen/Bath)','Framing Contractor','Custom Home Builder','HVAC','Electrical','Plumbing'];
var ICP_SUPPLIER_TYPES = ['Lumber / Building Materials','Metal / Steel Supplier','Roofing Materials','Plumbing / HVAC Supply','Electrical Supply'];
var ICP_CITIES = ['Dayton','Cincinnati','Indianapolis','Nashville'];

var LEAK_SIGNALS_CONTRACTOR = [
  'Contact-form only estimating (no automation)',
  'Owner handles all follow-up and projects',
  'No automated estimate workflow visible',
  'Call/form-only intake process',
  'Manual quote intake, owner-led operations',
  'Owner directly handles sales, estimating & billing',
  'Small team, owner heavily in the field',
  'No CRM or follow-up system on website',
  'Outdated or minimal web presence',
  'Phone call only intake process'
];
var LEAK_SIGNALS_SUPPLIER = [
  'Manual order intake (phone/email only)',
  'No online ordering or quote system',
  'Owner or one person handles all customer orders',
  'No delivery tracking or dispatch system',
  'Inventory managed on spreadsheets or paper',
  'No CRM — contractor relationships tracked manually',
  'AR follow-up done manually / slow collections',
  'No automated re-order or low-stock alerts',
  'Outdated or minimal web presence',
  'No pricing visibility or self-serve quote tool'
];

var AUDIT_AREAS = [
  {
    id:'scheduling', title:'Job Scheduling & Dispatch', icon:'📅',
    desc:'Manual crew assignments, missed updates, rescheduling chaos',
    questions:[
      { q:'How are crew assignments communicated to field staff?', opts:[
        {l:'Digital dispatch system — crews auto-notified',s:0},
        {l:'Group text or messaging app',s:1},
        {l:'Individual phone calls each morning',s:3},
        {l:'Owner manually calls/texts each person',s:4}
      ]},
      { q:'How is real-time job status tracked during the day?', opts:[
        {l:'Real-time app with field check-ins',s:0},
        {l:'Crew texts updates when done',s:2},
        {l:'End-of-day summary call',s:3},
        {l:'No formal process — owner manually checks in',s:4}
      ]},
      { q:'When a job gets rescheduled or delayed, how is the team notified?', opts:[

function scoreICP(p) {
  var score = 0; var good = []; var warn = [];
  var isSupplier = p.business_type === 'Building / Material Supplier';

  if (isSupplier) {
    if (ICP_SUPPLIER_TYPES.indexOf(p.trade_type) !== -1) { score += 25; good.push('Supplier type is high-value'); }
    else if (p.trade_type) { score += 10; warn.push('Supplier type — verify they serve trade contractors'); }
    var e = parseInt(p.employee_count) || 0;
    if (e >= 2 && e <= 20) { score += 25; good.push('Team size in sweet spot (2–20)'); }
    else if (e > 20 && e <= 50) { score += 12; good.push('Larger supplier — still viable'); warn.push('May have some dedicated ops staff already'); }
    else if (e < 2 && e > 0) { score += 5; warn.push('Very small — owner likely handles everything manually'); }
    else if (e > 50) { warn.push('Large supplier — may have dedicated systems team'); }
    if (p.serves_contractors) { score += 20; good.push('Confirmed serves trade contractors'); }
    else { warn.push('Verify primary customers are trade contractors'); }
    if (p.owner_operated) { score += 15; good.push('Owner-operated — owner is the bottleneck'); }
    var cityMatch = ICP_CITIES.some(function(c){ return (p.city||'').toLowerCase().indexOf(c.toLowerCase()) !== -1; });
    if (cityMatch) { score += 15; good.push('Target geography match'); }
    else { score += 5; warn.push('Outside primary target geo — still viable'); }
  } else {
    if (ICP_TRADES.indexOf(p.trade_type) !== -1) { score += 25; good.push('Trade type matches ICP'); }
    else if (p.trade_type) { score += 5; warn.push('Trade type is outside core focus'); }
    var e2 = parseInt(p.employee_count) || 0;
    if (e2 >= 5 && e2 <= 15) { score += 25; good.push('Employee count in sweet spot (5–15)'); }
    else if (e2 >= 16 && e2 <= 25) { score += 15; good.push('Employee count in range (16–25)'); warn.push('Upper end — may have some office staff'); }
    else if (e2 < 5 && e2 > 0) { score += 5; warn.push('Under 5 employees — owner may muscle through without systems'); }
    else if (e2 > 25) { warn.push('Over 25 employees — likely has dedicated ops staff'); }
    if (p.owner_operated) { score += 20; good.push('Owner-operated — owner is the bottleneck'); }
    else { warn.push('Not confirmed owner-operated'); }
    var cityMatch2 = ICP_CITIES.some(function(c){ return (p.city||'').toLowerCase().indexOf(c.toLowerCase()) !== -1; });
    if (cityMatch2) { score += 15; good.push('Target geography match'); }
    else { score += 5; warn.push('Outside primary target geo — still viable'); }
  }
  var leaks = p.leak_signals || [];
  if (leaks.length > 0) { score += Math.min(15, leaks.length * 5); good.push(leaks.length + ' operational leak signal(s) identified'); }
  var verdict = score >= 75 ? 'Qualified' : score >= 50 ? 'Borderline' : 'Not a Fit';
  var vcss = score >= 75 ? 'var(--accent2)' : score >= 50 ? 'var(--warn)' : 'var(--danger)';
  return { score: score, verdict: verdict, vcss: vcss, good: good, warn: warn };
}

function scoreAudit(answers) {
  var areaScores = {};
  AUDIT_AREAS.forEach(function(a) {
    var ans = answers[a.id] || [];
    var sc = ans.reduce(function(s, x){ return s + (x ? (x.s || 0) : 0); }, 0);
    var max = a.questions.length * 4;
    areaScores[a.id] = { score: sc, max: max, pct: max > 0 ? Math.round((sc / max) * 100) : 0 };
  });
  var ranked = AUDIT_AREAS.map(function(a) {
    return { id: a.id, area: a, score: areaScores[a.id].score, max: areaScores[a.id].max, pct: areaScores[a.id].pct };
  }).sort(function(a, b){ return b.score - a.score; });
  var high = ranked.filter(function(a){ return a.pct >= 50; }).length;
  var tier = high >= 5 ? 'full' : high >= 3 ? 'growth' : 'starter';
  return { areaScores: areaScores, ranked: ranked, tier: tier };
}

function painLabel(pct) {
  if (pct >= 75) return { l:'Critical', c:'var(--danger)' };
  if (pct >= 50) return { l:'High',     c:'var(--warn)' };
  if (pct >= 25) return { l:'Moderate', c:'var(--blue)' };
  return { l:'Low', c:'var(--accent2)' };
}

  else if (v === 'proposal') renderProposal();
  else if (v === 'objections') renderObjections();
  else if (v === 'close')  renderClose();
}

// ─── PIPELINE ─────────────────────────────────────────────────────────────────

function renderPipeline() {
  var prospects = getProspects();
  var selected = selectedProspectId ? getProspect(selectedProspectId) : null;

  // Detail panel
  var detailHtml = '';
  if (selected) {
    var icp = scoreICP(selected);
    var lastAudit = (selected.audits && selected.audits.length > 0) ? selected.audits[selected.audits.length - 1] : null;
    var stageOpts = STAGES.map(function(s){
      return '<option value="' + escAttr(s) + '"' + (selected.stage === s ? ' selected' : '') + '>' + escHtml(s) + '</option>';
    }).join('');

    var leakHtml = (selected.leak_signals && selected.leak_signals.length > 0)
      ? '<div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:6px">' +
        selected.leak_signals.map(function(l){ return '<span class="audit-tool-tag" style="font-size:9px">' + escHtml(l) + '</span>'; }).join('') + '</div>'
      : '';

    detailHtml =
      '<div class="pl-detail" id="pl-detail-panel">' +
      '<div class="pl-detail-header">' +
      '<div>' +
      '<div class="pl-detail-name">' + escHtml(selected.company_name) + '</div>' +
      '<div class="pl-detail-owner">' + escHtml(selected.owner_name || '—') + '</div>' +
      (selected.business_type ? '<div class="pl-detail-biz">' + escHtml(selected.business_type) + '</div>' : '') +
      '</div>' +
      '<button class="btn btn-ghost btn-xs" onclick="selectedProspectId=null;renderPipeline()">×</button>' +
      '</div>' +

      '<div style="margin-bottom:12px">' +
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">' +
      '<span class="intake-section-label" style="margin:0">ICP Match</span>' +
      '<span style="font-family:\'DM Mono\',monospace;font-size:11px;color:' + icp.vcss + '">' + icp.score + '/100 — ' + escHtml(icp.verdict) + '</span>' +
      '</div>' +
      '<div class="pl-icp-bar-wrap"><div class="pl-icp-bar-fill" style="width:' + icp.score + '%;background:' + icp.vcss + '"></div></div>' +
      '</div>' +

      '<div class="pl-detail-grid">' +
      '<div class="pl-detail-field"><div class="pl-detail-flabel">Trade</div><div class="pl-detail-fval">' + escHtml(selected.trade_type || '—') + '</div></div>' +
      '<div class="pl-detail-field"><div class="pl-detail-flabel">Employees</div><div class="pl-detail-fval">' + escHtml(selected.employee_count || '—') + '</div></div>' +
      '<div class="pl-detail-field"><div class="pl-detail-flabel">City</div><div class="pl-detail-fval">' + escHtml((selected.city || '') + (selected.state ? ', ' + selected.state : '') || '—') + '</div></div>' +
      '<div class="pl-detail-field"><div class="pl-detail-flabel">Stage</div>' +
      '<select class="form-select" style="padding:4px 6px;font-size:11px" onchange="moveStage(' + selected.id + ',this.value)">' + stageOpts + '</select>' +
      '</div>' +
      '</div>' +

      (selected.email || selected.phone ? '<div style="font-family:\'DM Mono\',monospace;font-size:10px;color:var(--muted);margin-bottom:10px">' +
        (selected.email ? escHtml(selected.email) + '<br>' : '') +
        (selected.phone ? escHtml(selected.phone) : '') +
      '</div>' : '') +

      (selected.notes ? '<div style="font-size:11px;color:var(--muted);line-height:1.65;padding:8px 10px;background:var(--surface2);border-radius:5px;margin-bottom:12px">' + escHtml(selected.notes) + '</div>' : '') +

      leakHtml +

      (lastAudit ? '<div style="margin-top:10px;padding:8px 10px;background:var(--surface2);border-radius:5px;font-size:11px">' +
        '<span style="color:var(--muted)">Last audit — </span><span style="color:var(--accent);text-transform:uppercase;font-family:\'DM Mono\',monospace;font-size:9px">' + escHtml(lastAudit.recommended_tier) + '</span>' +
        '</div>' : '') +

      '<div class="pl-detail-actions">' +
      '<button class="btn btn-ghost btn-sm" onclick="editProspect(' + selected.id + ')">Edit</button>' +
      '<button class="btn btn-secondary btn-sm" onclick="goToAudit(' + selected.id + ')">Audit →</button>' +
      '<button class="btn btn-primary btn-sm" onclick="goToProposal(' + selected.id + ')">Proposal →</button>' +
      '<button class="btn btn-danger btn-xs" onclick="deleteProspect(' + selected.id + ')">Delete</button>' +
      '</div>' +
      '</div>';
  }

  // Kanban columns
  var boardHtml = '<div class="pl-board">';
  STAGES.forEach(function(stage) {
    var stageProspects = prospects.filter(function(p){ return (p.stage || 'Cold') === stage; });
    var dotColor = STAGE_COLORS[stage];

    boardHtml += '<div class="pl-col">' +
      '<div class="pl-col-header">' +
      '<div class="pl-col-dot" style="background:' + dotColor + '"></div>' +
      '<span class="pl-col-label">' + escHtml(stage) + '</span>' +
      '<span class="pl-col-count">' + stageProspects.length + '</span>' +
      '</div>';

    if (stageProspects.length === 0) {
      boardHtml += '<div style="font-family:\'DM Mono\',monospace;font-size:10px;color:var(--border);text-align:center;padding:16px 0">Empty</div>';
    }

    stageProspects.forEach(function(p) {
      var icp = scoreICP(p);
      var isSelected = p.id === selectedProspectId;
      boardHtml += '<div class="pl-card' + (isSelected ? ' selected' : '') + '" onclick="selectProspect(' + p.id + ')">' +
        (p.business_type === 'Building / Material Supplier' ? '<span class="pl-sup-badge">SUP</span>' : '') +
        '<div class="pl-card-name">' + escHtml(p.company_name) + '</div>' +
        '<div class="pl-card-owner">' + escHtml(p.owner_name || '—') + '</div>' +
        '<div class="pl-card-trade">' + escHtml(p.trade_type || '—') + '</div>' +
        '<div class="pl-card-icp">' +
        '<div class="pl-card-bar"><div class="pl-card-bar-fill" style="width:' + icp.score + '%;background:' + icp.vcss + '"></div></div>' +
        '<span class="pl-card-score" style="color:' + icp.vcss + '">' + icp.score + '</span>' +
        '</div>' +
        '</div>';
    });

    boardHtml += '</div>';
  });
  boardHtml += '</div>';

  // Stats
  var total = prospects.length;
  var warm = prospects.filter(function(p){ return p.stage === 'Warm' || p.stage === 'Audit Scheduled' || p.stage === 'Proposal Sent'; }).length;
  var closed = prospects.filter(function(p){ return p.stage === 'Closed'; }).length;
  var qualified = prospects.filter(function(p){ return (scoreICP(p).verdict === 'Qualified'); }).length;

  var statsHtml = '<div class="stats-row" style="grid-template-columns:repeat(4,1fr);margin-bottom:16px">' +
    stat('Total Leads', total) + stat('In Pipeline', warm, 'accent') +
    stat('Closed', closed, 'green') + stat('Qualified ICP', qualified) +
    '</div>';

  var el = document.getElementById('view-pipeline');
  el.innerHTML = statsHtml +
    '<div style="display:flex;justify-content:flex-end;margin-bottom:14px">' +
    '<button class="btn btn-primary btn-sm" onclick="showView(\'intake\')">+ New Lead</button>' +
    '</div>' +
    detailHtml +
    boardHtml;
}

function stat(label, val, cls) {
  return '<div class="stat-card"><div class="stat-label">' + escHtml(label) + '</div>' +
    '<div class="stat-value ' + (cls || '') + '">' + val + '</div></div>';
}

function selectProspect(id) {
  selectedProspectId = (selectedProspectId === id) ? null : id;
  renderPipeline();
}

function moveStage(id, stage) {
  var p = getProspect(id);
  if (p) { p.stage = stage; saveProspects(); renderPipeline(); }
}

function deleteProspect(id) {
  if (!confirm('Remove this prospect and all their data?')) return;
  state.os_data.prospects = getProspects().filter(function(p){ return p.id !== id; });
  selectedProspectId = null;
  saveProspects();
  renderPipeline();
}

function goToAudit(id) {
  auditProspectId = id;
  auditAreaIdx = 0;
  auditAnswers = {};
  auditResults = null;
  showView('audit');
}

function goToProposal(id) {
  proposalProspectId = id;
  showView('proposal');
}

function editProspect(id) {
  var p = getProspect(id);
  if (!p) return;
  intakeEditId = id;
  intakeForm = {
    company_name: p.company_name || '',
    owner_name: p.owner_name || '',
    business_type: p.business_type || 'Trade Contractor',
    trade_type: p.trade_type || '',
    employee_count: p.employee_count ? String(p.employee_count) : '',
    city: p.city || '',
    state: p.state || '',
    email: p.email || '',
    phone: p.phone || '',
    website: p.website || '',
    owner_operated: !!p.owner_operated,
    serves_contractors: !!p.serves_contractors,
    leak_signals: p.leak_signals ? p.leak_signals.slice() : [],
    notes: p.notes || ''
  };
  showView('intake');
}

function intakeField(key, value) {
  intakeForm[key] = value;
  updateICPDisplay();
}

function intakeToggle(key) {
  intakeForm[key] = !intakeForm[key];
  updateICPDisplay();
}

function setBizType(type) {
  intakeForm.business_type = type;
  intakeForm.trade_type = '';
  intakeForm.leak_signals = [];
  intakeForm.serves_contractors = false;
  renderIntake();
}

function toggleLeak(signal) {
  var idx = intakeForm.leak_signals.indexOf(signal);
  if (idx === -1) intakeForm.leak_signals.push(signal);
  else intakeForm.leak_signals.splice(idx, 1);
  // Re-render just the leak tags and ICP
  renderIntake();
  // Restore focus / scroll position is lost but acceptable
}

function updateICPDisplay() {
  // Lightweight update — re-render just the ICP panel
  var icp = scoreICP(intakeForm);
  var scoreEl = document.querySelector('.intake-icp-score');
  var verdictEl = document.querySelector('.intake-icp-verdict');
  var fillEl = document.querySelector('.intake-icp-bar-fill');
  var signalsEl = document.querySelector('.intake-icp-panel > div:last-child');
  if (scoreEl) { scoreEl.textContent = icp.score; scoreEl.style.color = icp.vcss; }
  if (verdictEl) { verdictEl.textContent = icp.verdict; verdictEl.style.color = icp.vcss; }
  if (fillEl) { fillEl.style.width = icp.score + '%'; fillEl.style.background = icp.vcss; }
  if (signalsEl) {
    signalsEl.innerHTML =
      icp.good.map(function(g){ return '<div style="font-size:10px;color:var(--accent2)">✓ ' + escHtml(g) + '</div>'; }).join('') +
      icp.warn.map(function(w){ return '<div style="font-size:10px;color:var(--warn)">⚠ ' + escHtml(w) + '</div>'; }).join('');
  }
}

function saveIntakeLead() {
  var name = intakeForm.company_name.trim();
  if (!name) { showToast('⚠ Company name is required'); return; }
  var icp = scoreICP(intakeForm);
  var prospects = getProspects();

  if (intakeEditId !== null) {
    var existing = prospects.find(function(p){ return p.id === intakeEditId; });
    if (existing) {
      Object.assign(existing, {
        company_name: name,
        owner_name: intakeForm.owner_name.trim(),
        business_type: intakeForm.business_type,
        trade_type: intakeForm.trade_type,
        employee_count: parseInt(intakeForm.employee_count) || null,
        city: intakeForm.city.trim(),
        state: intakeForm.state.trim(),
        email: intakeForm.email.trim(),
        phone: intakeForm.phone.trim(),
        website: intakeForm.website.trim(),
        owner_operated: intakeForm.owner_operated,
        serves_contractors: intakeForm.serves_contractors,
        leak_signals: intakeForm.leak_signals.slice(),
        notes: intakeForm.notes.trim(),
        stage: intakeForm.stage || existing.stage || 'Cold',
        icp_score: icp.score,
        icp_verdict: icp.verdict
      });
    }
  } else {
    prospects.push({
      id: genId(),
      company_name: name,
      owner_name: intakeForm.owner_name.trim(),
      business_type: intakeForm.business_type,
      trade_type: intakeForm.trade_type,
      employee_count: parseInt(intakeForm.employee_count) || null,
      city: intakeForm.city.trim(),
      state: intakeForm.state.trim(),
      email: intakeForm.email.trim(),
      phone: intakeForm.phone.trim(),
      website: intakeForm.website.trim(),
      owner_operated: intakeForm.owner_operated,
      serves_contractors: intakeForm.serves_contractors,
      leak_signals: intakeForm.leak_signals.slice(),
      notes: intakeForm.notes.trim(),
      stage: intakeForm.stage || 'Cold',
      icp_score: icp.score,
      icp_verdict: icp.verdict,
      created_at: new Date().toISOString(),
      audits: [],
      proposals: []
    });
  }

  saveProspects();
  showToast('✓ Lead saved');
  cancelIntake();
  showView('pipeline');
}

function cancelIntake() {
  intakeEditId = null;
  intakeForm = {
    company_name:'', owner_name:'', business_type:'Trade Contractor', trade_type:'',
    employee_count:'', city:'', state:'', email:'', phone:'', website:'',
    owner_operated: false, serves_contractors: false, leak_signals: [], notes: '', stage: 'Cold'
  };
}

// ─── AUDIT TOOL ───────────────────────────────────────────────────────────────

function renderAuditView() {
  if (auditResults) { renderAuditResults(); return; }

  var prospects = getProspects();
  var area = AUDIT_AREAS[auditAreaIdx];
  var aAnswers = auditAnswers[area.id] || [];
  var answered = aAnswers.filter(function(x){ return x !== null && x !== undefined; }).length;

  var prospectSel = '<select class="form-select" style="max-width:320px;margin-bottom:16px" onchange="auditProspectId=this.value||null">' +
    '<option value="">Ad-hoc audit (not linked to prospect)</option>' +
    prospects.map(function(p){
      return '<option value="' + escAttr(String(p.id)) + '"' + (String(auditProspectId) === String(p.id) ? ' selected' : '') + '>' + escHtml(p.company_name) + (p.owner_name ? ' — ' + p.owner_name : '') + '</option>';
    }).join('') + '</select>';

  var progressHtml = '<div class="audit-progress">' +
    AUDIT_AREAS.map(function(a, i) {
      var done = (auditAnswers[a.id] || []).filter(function(x){ return x !== null && x !== undefined; }).length === a.questions.length;
      var cls = done ? 'done' : (i === auditAreaIdx ? 'current' : '');
      return '<div class="audit-prog-seg ' + cls + '" onclick="auditAreaIdx=' + i + ';renderAuditView()" title="' + escAttr(a.title) + '"></div>';
    }).join('') + '</div>';

  var questionsHtml = area.questions.map(function(q, qi) {
    return '<div class="audit-question">' +
      '<div class="audit-q-text">' + escHtml(q.q) + '</div>' +
      '<div class="audit-opts">' +
      q.opts.map(function(o) {
        var sel = aAnswers[qi] && aAnswers[qi].l === o.l;
        return '<button class="audit-opt' + (sel ? ' selected' : '') + '" onclick="setAuditAnswer(\'' + escAttr(area.id) + '\',' + qi + ',' + escAttr(JSON.stringify(o)) + ')">' + escHtml(o.l) + '</button>';
      }).join('') +
      '</div></div>';
  }).join('');

  var allComplete = AUDIT_AREAS.every(function(a) {
    var ans = auditAnswers[a.id] || [];
    return ans.filter(function(x){ return x !== null && x !== undefined; }).length === a.questions.length;
  });

  var navHtml = '<div style="display:flex;gap:10px;margin-top:16px">' +
    '<button class="btn btn-ghost" onclick="auditAreaIdx=Math.max(0,auditAreaIdx-1);renderAuditView()"' + (auditAreaIdx === 0 ? ' disabled' : '') + '>← Prev</button>' +
    (auditAreaIdx < AUDIT_AREAS.length - 1
      ? '<button class="btn btn-secondary" onclick="auditAreaIdx++;renderAuditView()"' + (answered < area.questions.length ? ' disabled style="opacity:0.4"' : '') + '>Next →</button>'
      : '<button class="btn btn-primary" onclick="showAuditResults()"' + (!allComplete ? ' disabled style="opacity:0.4"' : '') + '>' + (allComplete ? 'View Results →' : 'Complete all areas first') + '</button>'
    ) +
    '</div>';

  var html =
    '<div class="view-header">' +
    '<div class="view-title">Field-to-Office Audit</div>' +
    '<div class="view-sub">6-area assessment · answers auto-score pain severity</div>' +
    '</div>' +
    '<div class="max-600">' +
    prospectSel +
    progressHtml +
    '<div class="audit-area-card">' +
    '<div class="audit-area-header">' +
    '<span class="audit-area-icon">' + area.icon + '</span>' +
    '<div><div class="audit-area-title">' + escHtml(area.title) + '</div><div class="audit-area-desc">' + escHtml(area.desc) + '</div></div>' +
    '<span class="audit-area-count">' + answered + '/' + area.questions.length + '</span>' +
    '</div>' +
    questionsHtml +
    '</div>' +
    navHtml +
    '</div>';

  document.getElementById('view-audit').innerHTML = html;
}

function setAuditAnswer(areaId, qi, optJson) {
  if (!auditAnswers[areaId]) {
    var area = AUDIT_AREAS.find(function(a){ return a.id === areaId; });
    auditAnswers[areaId] = new Array(area.questions.length).fill(null);
  }
  auditAnswers[areaId][qi] = typeof optJson === 'string' ? JSON.parse(optJson) : optJson;
  renderAuditView();
}

function showAuditResults() {
  auditResults = scoreAudit(auditAnswers);
  renderAuditResults();
}

function renderAuditResults() {
  var r = auditResults;
  var tierNames = { starter:'Starter — $1,500', growth:'Growth — $2,250', full:'Full Integration — Custom' };
  var tierSubs = { starter:'1 workflow · 30-day support', growth:'2–3 connected workflows · 60-day support', full:'All 6 areas · Full system rebuild · 90-day support' };
  var tierColor = { starter:'var(--accent2)', growth:'var(--blue)', full:'var(--accent)' };

  var rankingsHtml = r.ranked.map(function(item, i) {
    var pl = painLabel(item.pct);
    var rec = TOOL_RECS[item.id];
    return '<div class="audit-ranking-card">' +
      '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">' +
      '<div><span class="audit-rank-num">#' + (i+1) + '</span><span class="audit-rank-title">' + item.area.icon + ' ' + escHtml(item.area.title) + '</span></div>' +
      '<span class="audit-rank-label" style="background:' + pl.c + '22;color:' + pl.c + '">' + pl.l + ' · ' + item.pct + '%</span>' +
      '</div>' +
      '<div class="audit-rank-bar"><div class="audit-rank-fill" style="width:' + item.pct + '%;background:' + pl.c + '"></div></div>' +
      (rec ? '<div class="audit-rank-why">' + escHtml(rec.why) + '</div>' +
        '<div>' + rec.tools.map(function(t){ return '<span class="audit-tool-tag">' + escHtml(t) + '</span>'; }).join('') + '</div>' : '') +
      '</div>';
  }).join('');

  var savedAuditId = null;

  var html =
    '<div class="view-header">' +
    '<div style="display:flex;align-items:center;gap:12px">' +
    '<button class="btn btn-ghost btn-sm" onclick="auditResults=null;renderAuditView()">← Back</button>' +
    '<div class="view-title" style="margin:0">Audit Results</div>' +
    '</div>' +
    '</div>' +
    '<div class="max-600">' +
    '<div class="audit-result-tier" style="border-color:' + tierColor[r.tier] + '">' +
    '<div style="font-family:\'DM Mono\',monospace;font-size:9px;text-transform:uppercase;letter-spacing:0.1em;color:var(--muted);margin-bottom:6px">Recommended Tier</div>' +
    '<div class="audit-tier-name">' + escHtml(tierNames[r.tier]) + '</div>' +
    '<div class="audit-tier-sub">' + escHtml(tierSubs[r.tier]) + '</div>' +
    '</div>' +
    '<div class="intake-section-label" style="margin-bottom:10px">Pain Rankings</div>' +
    rankingsHtml +
    '<div style="display:flex;gap:8px;margin-top:16px">' +
    '<button class="btn btn-primary" id="audit-save-btn" onclick="saveAuditResult()">Save to Prospect</button>' +
    '<button class="btn btn-secondary" onclick="goToProposalFromAudit()">Build Proposal →</button>' +
    '</div>' +
    '</div>';

  document.getElementById('view-audit').innerHTML = html;
}

function saveAuditResult() {
  var prospectId = auditProspectId ? parseInt(auditProspectId) : null;
  if (!prospectId) { showToast('⚠ Select a prospect first'); return; }
  var p = getProspect(prospectId);
  if (!p) return;
  if (!p.audits) p.audits = [];
  var auditEntry = {
    id: genId(),
    saved_at: new Date().toISOString(),
    answers: auditAnswers,
    area_scores: auditResults.areaScores,
    ranked_bottlenecks: auditResults.ranked.map(function(r){ return { id: r.id, title: r.area.title, score: r.score, max: r.max, pct: r.pct }; }),
    recommended_tier: auditResults.tier,
    total_pain_score: auditResults.ranked.reduce(function(s, a){ return s + a.score; }, 0)
  };
  p.audits.push(auditEntry);
  // Auto-advance stage to Audit Scheduled if still Cold/Warm
  if (p.stage === 'Cold' || p.stage === 'Warm') p.stage = 'Audit Scheduled';
  saveProspects();
  var btn = document.getElementById('audit-save-btn');
  if (btn) { btn.textContent = '✓ Saved'; btn.disabled = true; }
  showToast('✓ Audit saved to ' + p.company_name);
}

function goToProposalFromAudit() {
  if (auditProspectId) proposalProspectId = parseInt(auditProspectId);
  showView('proposal');
}

// ─── PROPOSAL ────────────────────────────────────────────────────────────────

function renderProposal() {
  var prospects = getProspects();
  var p = proposalProspectId ? getProspect(proposalProspectId) : null;
  var lastAudit = p && p.audits && p.audits.length > 0 ? p.audits[p.audits.length - 1] : null;

  var selOpts = '<option value="">Select prospect…</option>' +
    prospects.map(function(pr){
      return '<option value="' + escAttr(String(pr.id)) + '"' + (String(proposalProspectId) === String(pr.id) ? ' selected' : '') + '>' + escHtml(pr.company_name) + '</option>';
    }).join('');

  var controlsHtml =
    '<div class="no-print" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:20px">' +
    '<select class="form-select" style="min-width:220px" onchange="proposalProspectId=this.value?parseInt(this.value):null;proposalNotes=\'\';renderProposal()">' + selOpts + '</select>' +
    (lastAudit ? '<button class="btn btn-ghost btn-sm" onclick="window.print()">🖨 Print / PDF</button>' : '') +
    (lastAudit && p && p.stage !== 'Closed' ? '<button class="btn btn-secondary btn-sm" onclick="markProposalSent()">Mark Sent</button>' : '') +
    '</div>';

  if (!p) {
    document.getElementById('view-proposal').innerHTML =
      controlsHtml +
      '<div class="df-empty"><div class="df-empty-icon">◻</div>Select a prospect to generate their proposal<br><span style="font-size:11px">Complete the Audit first if you haven\'t already.</span></div>';
    return;
  }

  if (!lastAudit) {
    document.getElementById('view-proposal').innerHTML =
      controlsHtml +
      '<div class="df-empty"><div class="df-empty-icon">🔍</div>No audit found for ' + escHtml(p.company_name) + '<br><span style="font-size:11px">Complete the Audit first, then come back here.</span></div>';
    return;
  }

  var tier = lastAudit.recommended_tier || 'starter';
  var td = TIER_DATA[tier];
  var bottlenecks = (lastAudit.ranked_bottlenecks || []).filter(function(b){ return b.pct >= 50; }).slice(0, 4);
  var today = new Date().toLocaleDateString('en-US', { year:'numeric', month:'long', day:'numeric' });

  var findingsHtml = bottlenecks.length > 0 ? (
    '<div class="prop-section-label">What the Audit Revealed</div>' +
    bottlenecks.map(function(b, i) {
      var pl = painLabel(b.pct);
      return '<div class="prop-finding">' +
        '<div style="display:flex;align-items:center;justify-content:space-between">' +
        '<div class="prop-finding-title">#' + (i+1) + ' — ' + escHtml(b.title) + '</div>' +
        '<span style="font-family:\'DM Mono\',monospace;font-size:9px;color:' + pl.c + '">' + pl.l + ' Pain Area</span>' +
        '</div>' +
        '<div class="prop-finding-why">' + escHtml((TOOL_RECS[b.id] || {}).why || '') + '</div>' +
        '</div>';
    }).join('') + '<div style="margin-bottom:20px"></div>'
  ) : '';

  var proposalHtml =
    '<div class="prop-doc">' +
    '<div class="prop-doc-header">' +
    '<div><div class="prop-brand">StructTech LLC</div>' +
    '<div class="prop-tagline">Field-to-Office Technology Integration</div>' +
    '<div class="prop-contact">jacob@structtek.com · structtek.com · (937) 467-2660</div></div>' +
    '<div class="prop-to">' + today + '<br>Prepared for: <strong>' + escHtml(p.company_name) + '</strong><br>Attn: ' + escHtml(p.owner_name || 'Owner') + '</div>' +
    '</div>' +
    '<hr class="prop-divider">' +

    '<h2 style="font-size:18px;font-weight:700;margin-bottom:12px">Field-to-Office Integration Proposal</h2>' +
    '<p class="prop-intro">' + (p.owner_name ? escHtml(p.owner_name) + ', based' : 'Based') + ' on the operational audit we completed for ' + escHtml(p.company_name) + ', I\'ve put together a focused implementation plan to address the specific gaps that are costing you the most time and revenue right now. This proposal outlines exactly what we found, what we\'ll fix, and what it looks like to work together.</p>' +

    findingsHtml +

    '<div class="prop-section-label">Scope of Work</div>' +
    '<div class="prop-scope-box">' +
    '<div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px">' +
    '<div><div class="prop-tier-name">' + escHtml(td.name) + ' Package</div>' +
    '<div style="font-size:11px;color:var(--muted)">Timeline: ' + escHtml(td.timeline) + ' · Support: ' + escHtml(td.support) + ' post-delivery</div></div>' +
    '<div class="prop-price">' + escHtml(td.price) + '</div>' +
    '</div></div>' +

    '<div class="prop-section-label">What\'s Included</div>' +
    '<ul class="prop-includes">' + td.includes.map(function(item){ return '<li>' + escHtml(item) + '</li>'; }).join('') + '</ul>' +

    '<div class="prop-section-label" style="margin-top:20px">The Process</div>' +
    '<div class="prop-process-steps">' +
    ['Assessment & Planning','Build & Configure','Test & Import','Train & Hand Off'].map(function(s, i){
      return '<div class="prop-step"><div class="prop-step-num">' + (i+1) + '</div><div class="prop-step-label">' + escHtml(s) + '</div></div>';
    }).join('') +
    '</div>' +

    '<div class="no-print" style="margin:16px 0">' +
    '<div class="intake-section-label">Custom notes (optional — will appear in proposal)</div>' +
    '<textarea class="form-textarea" rows="3" placeholder="Any specific context, references, or next-step instructions..." oninput="proposalNotes=this.value">' + escHtml(proposalNotes) + '</textarea>' +
    '</div>' +

    (proposalNotes ? '<div class="prop-section-label">Additional Notes</div><p style="font-size:12px;color:var(--text);line-height:1.7;margin-bottom:20px">' + escHtml(proposalNotes) + '</p>' : '') +

    '<hr class="prop-divider">' +
    '<p style="font-size:12px;color:var(--text);line-height:1.75;margin-bottom:16px">If this looks right, the next step is a 30-minute kickoff call where we confirm scope, review your current tools, and get your first workflow on the build schedule. There\'s no lengthy contract — just a simple one-page agreement before we start.</p>' +
    '<div><strong style="font-size:13px">Jacob Walker</strong><br>' +
    '<span style="font-size:11px;color:var(--muted)">Founder, StructTech LLC<br>jacob@structtek.com · (937) 467-2660</span></div>' +
    '</div>';

  document.getElementById('view-proposal').innerHTML = controlsHtml + proposalHtml;
}

function markProposalSent() {
  var p = proposalProspectId ? getProspect(proposalProspectId) : null;
  if (!p) return;
  p.stage = 'Proposal Sent';
  saveProspects();
  renderProposal();
  showToast('✓ Stage updated to Proposal Sent');
}

// ─── OBJECTIONS ───────────────────────────────────────────────────────────────

function renderObjections() {
  var cat = OBJECTIONS[objCatIdx];

  var sidebarHtml = '<div class="obj-sidebar">' +
    OBJECTIONS.map(function(o, i) {
      return '<button class="obj-cat-btn' + (i === objCatIdx ? ' active' : '') + '" onclick="objCatIdx=' + i + ';objOpenItem=null;renderObjections()">' + escHtml(o.cat) + '</button>';
    }).join('') +
    '</div>';

  var itemsHtml = cat.items.map(function(obj, i) {
    var isOpen = objOpenItem === i;
    return '<div class="obj-item' + (isOpen ? ' open' : '') + '">' +
      '<button class="obj-item-trigger" onclick="objOpenItem=' + (isOpen ? 'null' : i) + ';renderObjections()">' +
      '<span class="obj-trigger-text">' + escHtml(obj.t) + '</span>' +
      '<span class="obj-chevron">' + (isOpen ? '▲' : '▼') + '</span>' +
      '</button>' +
      (isOpen ?
        '<div class="obj-body open">' +
        '<div class="obj-response-label">Your Response</div>' +
        '<div class="obj-response-text">' + escHtml(obj.r) + '</div>' +
        '<div class="obj-followup-label">Follow-Up Move</div>' +
        '<div class="obj-followup-text">' + escHtml(obj.f) + '</div>' +
        '</div>' : '') +
      '</div>';
  }).join('');

  document.getElementById('view-objections').innerHTML =
    '<div class="view-header">' +
    '<div class="view-title">Objection Handling</div>' +
    '<div class="view-sub">Tap an objection to reveal the full response and follow-up move.</div>' +
    '</div>' +
    '<div class="obj-layout">' +
    sidebarHtml +
    '<div class="obj-content">' +
    '<div style="font-size:14px;font-weight:600;margin-bottom:14px">' + escHtml(cat.cat) + '</div>' +
    itemsHtml +
    '</div></div>';
}

// ─── CLOSE GUIDE ─────────────────────────────────────────────────────────────

function renderClose() {
  var prospects = getProspects();
  var activeProspects = prospects.filter(function(p){
    var s = (p.stage||'').toLowerCase();
    return s === 'warm' || s === 'audit scheduled' || s === 'proposal sent';
  });
  var p = closeProspectId ? getProspect(closeProspectId) : null;
  var lastAudit = p && p.audits && p.audits.length > 0 ? p.audits[p.audits.length - 1] : null;
  var tier = lastAudit ? lastAudit.recommended_tier : 'starter';
  var script = CLOSING_SCRIPTS[tier] || CLOSING_SCRIPTS.starter;
  var top3 = lastAudit ? (lastAudit.ranked_bottlenecks || []).slice(0, 3).map(function(b){ return b.title; }) : [];

  var selOpts = '<option value="">Select an active prospect…</option>' +
    activeProspects.map(function(pr){
      return '<option value="' + escAttr(String(pr.id)) + '"' + (String(closeProspectId) === String(pr.id) ? ' selected' : '') + '>' + escHtml(pr.company_name) + ' · ' + escHtml(pr.stage) + '</option>';
    }).join('');

  // Tabs
  var tabsHtml = '<div class="close-tabs">' +
    ['pre','script','post'].map(function(t, i) {
      var labels = { pre:'Pre-Close Checklist', script:'Closing Script', post:'Post-Close Actions' };
      return '<button class="close-tab-btn' + (closeTab === t ? ' active' : '') + '" onclick="closeTab=\'' + t + '\';renderClose()">' + escHtml(labels[t]) + '</button>';
    }).join('') + '</div>';

  var contentHtml = '';
  if (closeTab === 'pre') {
    var preCount = Object.values(closePreChecks).filter(Boolean).length;
    contentHtml = '<p style="font-size:11px;color:var(--muted);margin-bottom:12px">Before the closing call, confirm each item below.</p>' +
      PRE_CLOSE_ITEMS.map(function(item, i) {
        var checked = !!closePreChecks[i];
        return '<div class="close-check-item' + (checked ? ' checked' : '') + '" onclick="closePreChecks[' + i + ']=!' + checked + ';renderClose()">' +
          '<span class="close-check-icon">' + (checked ? '✓' : '○') + '</span>' +
          '<span class="close-check-text">' + escHtml(item) + '</span></div>';
      }).join('') +
      '<div style="font-family:\'DM Mono\',monospace;font-size:10px;color:var(--muted);margin-top:8px">' + preCount + ' / ' + PRE_CLOSE_ITEMS.length + ' checked</div>';

  } else if (closeTab === 'script') {
    contentHtml = '<div class="close-script-setup">' +
      '<div class="close-script-title">' + escHtml(script.title) + '</div>' +
      '<div class="close-script-subtitle">' + escHtml(script.setup) + '</div>' +
      '</div>' +
      (top3.length > 0 ? '<div style="padding:8px 12px;background:var(--surface2);border-radius:5px;font-size:11px;margin-bottom:12px">' +
        '<span style="color:var(--muted)">Fill in from audit: </span>' +
        top3.map(function(t){ return '<span style="color:var(--accent)">' + escHtml(t) + '</span>'; }).join(' · ') + '</div>' : '') +
      script.steps.map(function(step, i) {
        return '<div class="close-step">' +
          '<div class="close-step-label">Step ' + (i+1) + ' — ' + escHtml(step.label) + '</div>' +
          '<div class="close-step-body">' + escHtml(step.s) + '</div>' +
          '</div>';
      }).join('');

  } else if (closeTab === 'post') {
    var postCount = Object.values(closePostChecks).filter(Boolean).length;
    contentHtml = '<p style="font-size:11px;color:var(--muted);margin-bottom:12px">They said yes. Lock in every handoff step before the call ends.</p>' +
      POST_CLOSE_ITEMS.map(function(item, i) {
        var checked = !!closePostChecks[i];
        return '<div class="close-check-item' + (checked ? ' checked' : '') + '" onclick="closePostChecks[' + i + ']=!' + checked + ';renderClose()">' +
          '<span class="close-check-icon">' + (checked ? '✓' : '○') + '</span>' +
          '<span class="close-check-text">' + escHtml(item) + '</span></div>';
      }).join('') +
      '<div style="font-family:\'DM Mono\',monospace;font-size:10px;color:var(--muted);margin-top:8px">' + postCount + ' / ' + POST_CLOSE_ITEMS.length + ' completed</div>';
  }

  document.getElementById('view-close').innerHTML =
    '<div class="view-header">' +
    '<div style="display:flex;align-items:center;justify-content:space-between">' +
    '<div class="view-title" style="margin:0">Close Guide</div>' +
    (p ? '<button class="btn btn-primary btn-sm" onclick="markClosed()">Mark Closed 🎉</button>' : '') +
    '</div>' +
    '</div>' +
    '<div class="max-600">' +
    '<select class="form-select" style="margin-bottom:16px" onchange="closeProspectId=this.value?parseInt(this.value):null;closeTab=\'pre\';closePreChecks={};closePostChecks={};renderClose()">' + selOpts + '</select>' +
    tabsHtml +
    contentHtml +
    '</div>';
}

function markClosed() {
  var p = closeProspectId ? getProspect(closeProspectId) : null;
  if (!p) return;
  p.stage = 'Closed';
  saveProspects();
  renderClose();
  showToast('🎉 Closed — ' + p.company_name);
}

// ─── HEADER ───────────────────────────────────────────────────────────────────

function renderHeader() {
  var d = new Date();
  var days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var el = document.getElementById('header-date');
  if (el) el.textContent = days[d.getDay()] + ', ' + months[d.getMonth()] + ' ' + d.getDate();
}

// ─── INIT ─────────────────────────────────────────────────────────────────────

async function init() {
  await loadState();
  if (!state.os_data.prospects) state.os_data.prospects = [];
  renderHeader();
  renderNav('clients');
  showView('pipeline');
}

document.addEventListener('DOMContentLoaded', init);
</script>
